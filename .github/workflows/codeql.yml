name: "CodeQL"

on:
  push:
    branches:
      - develop
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: amd-runner-2204
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - go

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # Setup environment
      - name: Setup Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: 1.27.3

      - name: Verify Go version
        if: ${{ matrix.language == 'go' }}
        run: go version

      # Export dependencies
      - name: Export Go dependencies
        if: ${{ matrix.language == 'go' }}
        run: go mod tidy

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          languages: ${{ matrix.language }}

      # Build project
      - name: Build Go project
        if: ${{ matrix.language == 'go' }}
        run: make build-aggkit

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          category: "/codeql/${{ matrix.language }}-analysis"
