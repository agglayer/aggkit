name: "CodeQL"

on:
  push:
    branches:
      - develop
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: amd-runner-2204
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - go

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Setup environment
      - name: Setup Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: 1.27.4

      - name: Verify Go version
        if: ${{ matrix.language == 'go' }}
        run: go version

      # Export dependencies
      - name: Export Go dependencies
        if: ${{ matrix.language == 'go' }}
        run: go mod tidy

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}

      # Build project
      - name: Build Go project
        if: ${{ matrix.language == 'go' }}
        run: make build-aggkit build-ger_validator_signer

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/codeql/${{ matrix.language }}-analysis"
