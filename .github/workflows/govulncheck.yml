name: Go Vulnerability Check

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  govulncheck_job:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Run govulncheck
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-input: 1.27.4
          go-package: ./...

  # ger_validator_signer is its own Go module: the job above doesn't see it
  govulncheck_ger_validator_signer:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Run govulncheck on ger_validator_signer
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0
        with:
          # Same Go as the job above. There govulncheck runs with the default of the action (stable): its "with" is
          # on the setup-go step, that runs after it and has no go-version-input input
          go-version-input: stable
          go-package: ./...
          work-dir: tools/ger_validator_signer
