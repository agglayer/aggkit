name: Lint
on:
  push:
    branches:
      - main
      - develop
      - update-external-dependencies
      - 'release/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: amd-runner-2204
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.3

      - name: Checkout code
        uses: actions/checkout@v5

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.4.0
          args: --timeout=30m
