name: Release

# Release images are published only from a release tag, after the tag passes
# the preflight checks and a reviewer approves the `release` environment.
#
#   preflight -> approve (environment: release) -> build -> publish
#
# Nothing is pushed to the registry before `approve` succeeds: `build` pushes
# per-platform images by digest, so the approval gate sits in front of it.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

# One release run per tag. A run waiting for approval is never cancelled by
# another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  REGEX_IMAGE: ${{ github.repository }}:\\d+\\.\\d+\\.\\d+

jobs:
  # Gate 1: the ref must be a release tag (vX.Y.Z or vX.Y.Z-<pre>) whose commit
  # is on develop or on a release/* branch, and the version must not be
  # published yet (published versions are immutable).
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ancestry.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag ancestry
        id: ancestry
        run: scripts/release/check_tag_ancestry.sh "$GITHUB_REF"

      - name: Check the version is not already published
        env:
          VERSION: ${{ steps.ancestry.outputs.version }}
        run: |
          for tag in "${VERSION}" "${VERSION}-no_shell" "${VERSION}-dev"; do
            image="${REGISTRY_IMAGE}:${tag}"
            if out=$(docker buildx imagetools inspect "$image" 2>&1); then
              echo "::error::${image} is already published; release versions are immutable, tag a new version instead"
              exit 1
            fi
            if ! grep -qi "not found" <<< "$out"; then
              echo "::error::cannot tell whether ${image} is already published:"
              echo "$out"
              exit 1
            fi
            echo "${image} is not published yet"
          done

  # Gate 2: deployment review. The `release` environment requires approval by
  # a release approver other than the person who triggered the run.
  approve:
    needs: preflight
    permissions: {}
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Approved release
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: echo "Approved release of tag ${TAG} (commit ${COMMIT}), version ${VERSION}"

  build:
    needs: approve
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'arm-runner-2204' || 'amd-runner-2204' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        variant:
          - { suffix: "", include_shell: "false", description: "production" }
          - {
              suffix: "-dev",
              include_shell: "true",
              description: "development",
            }
    outputs:
      IMAGE_NAME_PROD: ${{ steps.image_builder_prod.outputs.IMAGE }}
      IMAGE_NAME_DEV: ${{ steps.image_builder_dev.outputs.IMAGE }}
      TAGS_PROD: ${{ steps.meta_prod.outputs.tags }}
      TAGS_DEV: ${{ steps.meta_dev.outputs.tags }}
      VERSION: ${{ steps.meta_prod.outputs.version }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          VARIANT_SUFFIX="${{ matrix.variant.suffix }}"
          echo "VARIANT_SUFFIX=$VARIANT_SUFFIX" >> "$GITHUB_ENV"
          PLATFORM_VARIANT="${platform//\//-}${VARIANT_SUFFIX}"
          echo "PLATFORM_VARIANT=$PLATFORM_VARIANT" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      # Only exact version tags are published: no moving X.Y or latest tags.
      - name: Docker meta (prod)
        id: meta_prod
        if: matrix.variant.suffix == ''
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},suffix=-no_shell

      - name: Docker meta (dev)
        id: meta_dev
        if: matrix.variant.suffix != ''
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-dev

      - name: Image name builder (prod)
        id: image_builder_prod
        if: matrix.variant.suffix == ''
        run: |
          IMAGE=$(jq -ecr '.tags | map(select(test("${{ env.REGEX_IMAGE }}"; "i"))) | first | sub(":.*$";"")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Image name builder (dev)
        id: image_builder_dev
        if: matrix.variant.suffix != ''
        run: |
          IMAGE=$(jq -ecr '.tags | map(select(test("${{ env.REGEX_IMAGE }}.*-dev$"; "i"))) | first | sub(":.*$";"")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each platform image carries an SBOM and full (mode=max) build provenance.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: false
          platforms: ${{ matrix.platform }}
          labels: ${{ (matrix.variant.suffix == '') && steps.meta_prod.outputs.labels || steps.meta_dev.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INCLUDE_SHELL=${{ matrix.variant.include_shell }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ (matrix.variant.suffix == '') && steps.image_builder_prod.outputs.IMAGE || steps.image_builder_dev.outputs.IMAGE }},push-by-digest=true,push=true

      - name: Verify version in image
        run: |
          IMAGE_NAME="${{ (matrix.variant.suffix == '') && steps.image_builder_prod.outputs.IMAGE || steps.image_builder_dev.outputs.IMAGE }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          out=$(docker run --rm "${IMAGE_NAME}@${DIGEST}" version) || { echo "ERROR: docker run failed"; exit 1; }
          ver=$(echo "$out" | awk '/^Version:/{print $2}')
          [ -n "$ver" ] || { echo "ERROR: Docker image has no version embedded"; exit 1; }
          echo "Version check passed: $ver"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}.${{ env.PLATFORM_VARIANT }}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_VARIANT }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Creates the tagged multi-platform manifest lists, then signs each one with
  # cosign (keyless, bound to this workflow's identity) and pushes a GitHub
  # build-provenance attestation for it to the registry.
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
    strategy:
      matrix:
        variant:
          - { suffix: "", description: "production" }
          - { suffix: "-dev", description: "development" }
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*${{ matrix.variant.suffix }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE_NAME="${{ (matrix.variant.suffix == '') && needs.build.outputs.IMAGE_NAME_PROD || needs.build.outputs.IMAGE_NAME_DEV }}"
          TAGS="${{ (matrix.variant.suffix == '') && needs.build.outputs.TAGS_PROD || needs.build.outputs.TAGS_DEV }}"
          SUFFIX="${{ matrix.variant.suffix }}"
          args=()
          while IFS= read -r tag; do
            tag="${tag//[[:space:]]/}"
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          # Digest files are named <digest>.<os>-<arch><suffix>; take only the
          # platform images of this variant (the prod pattern also downloads -dev).
          for f in *; do
            case "$f" in
              *-dev) [ "$SUFFIX" = "-dev" ] || continue ;;
              *) [ -z "$SUFFIX" ] || continue ;;
            esac
            args+=("${IMAGE_NAME}@sha256:${f%%.*}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Resolve manifest list digest
        id: manifest
        run: |
          IMAGE_NAME="${{ (matrix.variant.suffix == '') && needs.build.outputs.IMAGE_NAME_PROD || needs.build.outputs.IMAGE_NAME_DEV }}"
          TAGS="${{ (matrix.variant.suffix == '') && needs.build.outputs.TAGS_PROD || needs.build.outputs.TAGS_DEV }}"
          FIRST_TAG=$(echo "$TAGS" | head -n1)
          DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Manifest}}' | jq -er .digest)
          echo "Manifest list of ${FIRST_TAG}: ${DIGEST}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # Keyless signature: the certificate identity is this workflow at the
      # release tag, issued through GitHub's OIDC token.
      - name: Sign manifest list
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Inspect image
        run: |
          TAGS="${{ (matrix.variant.suffix == '') && needs.build.outputs.TAGS_PROD || needs.build.outputs.TAGS_DEV }}"
          # Use the first tag for inspection
          FIRST_TAG=$(echo "$TAGS" | head -n1)
          docker buildx imagetools inspect "$FIRST_TAG"
