name: Release

# Release images are published only from a release tag, after the tag passes
# the preflight checks and a reviewer approves the `release` environment.
#
#   preflight -> build -> publish (environment: release, needs approval)
#
# `build` pushes the per-platform images by digest to the staging package
# ghcr.io/<repo>-dev (the same package used by branch builds), never to the
# production package ghcr.io/<repo>. The reviewer approves the images that were
# actually built (their digests are in the job summaries). Only `publish`, which
# runs after the approval of the `release` environment, writes to the production
# package: it assembles the tagged manifest lists from the staged digests of
# this run, then signs and attests them. It logs in to ghcr.io with a credential
# that exists only as a secret of the `release` environment; the workflow token
# (GITHUB_TOKEN) is used only for the staging package. Nothing reaches
# ghcr.io/<repo> before the approval.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

# One release run per tag. A run waiting for approval is never cancelled by
# another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  # Production package: written only by `publish`, after approval, with the
  # credential held by the `release` environment.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # Staging package: `build` pushes the per-platform images here, by digest.
  STAGING_IMAGE: ghcr.io/${{ github.repository }}-dev
  REGEX_IMAGE: ${{ github.repository }}:\\d+\\.\\d+\\.\\d+

jobs:
  # Gate 1: the ref must be a release tag (vX.Y.Z or vX.Y.Z-<pre>) whose commit
  # is on develop or on a release/* branch, and the version must not be
  # published yet (published versions are immutable).
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ancestry.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag ancestry
        id: ancestry
        run: scripts/release/check_tag_ancestry.sh "$GITHUB_REF"

      - name: Check the version is not already published
        env:
          VERSION: ${{ steps.ancestry.outputs.version }}
        run: |
          for tag in "${VERSION}" "${VERSION}-no_shell" "${VERSION}-dev"; do
            image="${REGISTRY_IMAGE}:${tag}"
            if out=$(docker buildx imagetools inspect "$image" 2>&1); then
              echo "::error::${image} is already published; release versions are immutable, tag a new version instead"
              exit 1
            fi
            if ! grep -qi "not found" <<< "$out"; then
              echo "::error::cannot tell whether ${image} is already published:"
              echo "$out"
              exit 1
            fi
            echo "${image} is not published yet"
          done

  # Builds the platform images and stages them by digest in the staging package
  # (STAGING_IMAGE) with the workflow token; nothing is written to the production
  # package here. The digests of what was built are listed in each job summary
  # for the reviewer.
  build:
    needs: preflight
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'arm-runner-2204' || 'amd-runner-2204' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        variant:
          - { suffix: "", include_shell: "false", description: "production" }
          - {
              suffix: "-dev",
              include_shell: "true",
              description: "development",
            }
    outputs:
      IMAGE_NAME_PROD: ${{ steps.image_builder_prod.outputs.IMAGE }}
      IMAGE_NAME_DEV: ${{ steps.image_builder_dev.outputs.IMAGE }}
      TAGS_PROD: ${{ steps.meta_prod.outputs.tags }}
      TAGS_DEV: ${{ steps.meta_dev.outputs.tags }}
      VERSION: ${{ steps.meta_prod.outputs.version }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          VARIANT_SUFFIX="${{ matrix.variant.suffix }}"
          echo "VARIANT_SUFFIX=$VARIANT_SUFFIX" >> "$GITHUB_ENV"
          PLATFORM_VARIANT="${platform//\//-}${VARIANT_SUFFIX}"
          echo "PLATFORM_VARIANT=$PLATFORM_VARIANT" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Only exact version tags are published: no moving X.Y or latest tags.
      - name: Docker meta (prod)
        id: meta_prod
        if: matrix.variant.suffix == ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},suffix=-no_shell

      - name: Docker meta (dev)
        id: meta_dev
        if: matrix.variant.suffix != ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-dev

      - name: Image name builder (prod)
        id: image_builder_prod
        if: matrix.variant.suffix == ''
        run: |
          IMAGE=$(jq -ecr '.tags | map(select(test("${{ env.REGEX_IMAGE }}"; "i"))) | first | sub(":.*$";"")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Image name builder (dev)
        id: image_builder_dev
        if: matrix.variant.suffix != ''
        run: |
          IMAGE=$(jq -ecr '.tags | map(select(test("${{ env.REGEX_IMAGE }}.*-dev$"; "i"))) | first | sub(":.*$";"")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to the container registry (staging package)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each platform image carries an SBOM and full (mode=max) build provenance.
      # The image is pushed to the staging package, not to the production one.
      - name: Build and push by digest to staging
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          platforms: ${{ matrix.platform }}
          labels: ${{ (matrix.variant.suffix == '') && steps.meta_prod.outputs.labels || steps.meta_dev.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INCLUDE_SHELL=${{ matrix.variant.include_shell }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.STAGING_IMAGE }},push-by-digest=true,push=true

      - name: Verify version in image
        run: |
          IMAGE_NAME="${STAGING_IMAGE}"
          DIGEST="${{ steps.build.outputs.digest }}"
          out=$(docker run --rm "${IMAGE_NAME}@${DIGEST}" version) || { echo "ERROR: docker run failed"; exit 1; }
          ver=$(echo "$out" | awk '/^Version:/{print $2}')
          [ -n "$ver" ] || { echo "ERROR: Docker image has no version embedded"; exit 1; }
          echo "Version check passed: $ver"
          echo "VERSION_IN_IMAGE=$ver" >> "$GITHUB_ENV"

      # The digest files are what `publish` lists and promotes.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}.${{ env.PLATFORM_VARIANT }}"
          {
            echo "### Staged ${{ matrix.variant.description }} image, ${{ matrix.platform }}"
            echo ""
            echo "- Image: \`${STAGING_IMAGE}@${digest}\`"
            echo "- Version reported by the image: \`${VERSION_IN_IMAGE}\`"
            echo "- Has an SBOM and mode=max build provenance"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_VARIANT }}
          path: /tmp/digests/*
          if-no-files-found: error
          # The files are empty and must outlive the approval wait (up to 30
          # days) and a re-run of `publish`.
          retention-days: 30

  # Gate 2: deployment review, and the only job that can write the production
  # package. The `release` environment requires approval by a release approver
  # other than the person who triggered the run, and it is the only place that
  # holds the credential for ghcr.io/<repo> (secrets RELEASE_REGISTRY_USER and
  # RELEASE_REGISTRY_TOKEN). The workflow token is never used for that package,
  # so no other job, and no other workflow, can write to it. The reviewer
  # decides on the images staged by `build` (digests in the build job
  # summaries); this job runs after the approval and promotes exactly these
  # digests.
  #
  # Creates the tagged multi-platform manifest lists in the production package
  # from the staged digests built in this run (taken from the build artifacts,
  # not looked up by tag), then signs each one with cosign (keyless, bound to
  # this workflow's identity) and pushes a GitHub build-provenance attestation
  # for it to the registry. The signatures and attestations are pushed with the
  # same release credential. Both variants are handled in this one job so that
  # a release needs a single approval.
  publish:
    needs:
      - preflight
      - build
    # No packages permission: the workflow token cannot write any package here.
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Download staged digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Approved release
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo "### Approved release"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Staged platform images (digest, platform and variant):"
            for f in /tmp/digests/*; do
              name=$(basename "$f")
              echo "  - \`${STAGING_IMAGE}@sha256:${name%%.*}\` (${name#*.})"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the release registry credential
        env:
          REGISTRY_USER: ${{ secrets.RELEASE_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::the secrets RELEASE_REGISTRY_USER and RELEASE_REGISTRY_TOKEN must be set in the release environment"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # The credential for the production package. It is stored only as secrets
      # of the `release` environment, and it also serves the cosign signature
      # and the attestation pushes below (both read the registry login).
      - name: Login to the container registry with the release credential
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.RELEASE_REGISTRY_USER }}
          password: ${{ secrets.RELEASE_REGISTRY_TOKEN }}

      # Sources are the staged per-platform digests of this run; each manifest
      # list is created in the production package under the final tags. The
      # source images keep their SBOM and provenance attestation manifests.
      - name: Create manifest lists from staged digests and push
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE_NAME_PROD: ${{ needs.build.outputs.IMAGE_NAME_PROD }}
          TAGS_PROD: ${{ needs.build.outputs.TAGS_PROD }}
          IMAGE_NAME_DEV: ${{ needs.build.outputs.IMAGE_NAME_DEV }}
          TAGS_DEV: ${{ needs.build.outputs.TAGS_DEV }}
        run: |
          promote() {
            local variant="$1" suffix="$2" image="$3" tags="$4"
            local args=() tag first_tag="" f digest manifest_digest sources=0
            while IFS= read -r tag; do
              tag="${tag//[[:space:]]/}"
              if [ -n "$tag" ]; then
                args+=(-t "$tag")
                [ -n "$first_tag" ] || first_tag="$tag"
              fi
            done <<< "$tags"
            [ "${#args[@]}" -gt 0 ] || { echo "::error::no tags to publish for the ${variant} variant"; exit 1; }
            # Digest files are named <digest>.<os>-<arch><suffix>; take only the
            # platform images of this variant.
            for f in *; do
              case "$f" in
                *-dev) [ "$suffix" = "-dev" ] || continue ;;
                *) [ -z "$suffix" ] || continue ;;
              esac
              digest="${f%%.*}"
              if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::unexpected digest file name: $f"
                exit 1
              fi
              args+=("${STAGING_IMAGE}@sha256:${digest}")
              sources=$((sources + 1))
            done
            # One image per platform (linux/amd64 and linux/arm64).
            if [ "$sources" -ne 2 ]; then
              echo "::error::expected 2 staged platform images for the ${variant} variant, found ${sources}"
              exit 1
            fi
            echo "Promoting ${sources} staged images of ${STAGING_IMAGE} to ${image}"
            docker buildx imagetools create "${args[@]}"
            manifest_digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -er .digest)
            echo "Manifest list of ${first_tag}: ${manifest_digest}"
            {
              echo "image_${variant}=${image}"
              echo "digest_${variant}=${manifest_digest}"
            } >> "$GITHUB_OUTPUT"
          }
          promote prod "" "$IMAGE_NAME_PROD" "$TAGS_PROD"
          promote dev "-dev" "$IMAGE_NAME_DEV" "$TAGS_DEV"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # Keyless signature: the certificate identity is this workflow at the
      # release tag, issued through GitHub's OIDC token.
      - name: Sign manifest lists
        env:
          IMAGE_PROD: ${{ steps.manifest.outputs.image_prod }}
          DIGEST_PROD: ${{ steps.manifest.outputs.digest_prod }}
          IMAGE_DEV: ${{ steps.manifest.outputs.image_dev }}
          DIGEST_DEV: ${{ steps.manifest.outputs.digest_dev }}
        run: |
          cosign sign --yes "${IMAGE_PROD}@${DIGEST_PROD}"
          cosign sign --yes "${IMAGE_DEV}@${DIGEST_DEV}"

      - name: Attest build provenance (prod)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image_prod }}
          subject-digest: ${{ steps.manifest.outputs.digest_prod }}
          push-to-registry: true

      - name: Attest build provenance (dev)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image_dev }}
          subject-digest: ${{ steps.manifest.outputs.digest_dev }}
          push-to-registry: true

      - name: Inspect images
        env:
          TAGS_PROD: ${{ needs.build.outputs.TAGS_PROD }}
          TAGS_DEV: ${{ needs.build.outputs.TAGS_DEV }}
        run: |
          # Use the first tag of each variant for inspection
          docker buildx imagetools inspect "$(head -n1 <<< "$TAGS_PROD")"
          docker buildx imagetools inspect "$(head -n1 <<< "$TAGS_DEV")"
