# This workflow runs the Bats E2E tests for aggkit.
# - On push: uses hardcoded kurtosis-cdk commit
# - On schedule: uses latest kurtosis-cdk main commit with Slack notifications
name: Bats E2E Tests

on:
  push:
    branches:
      - "**"
  schedule:
    # Run every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  AGGKIT_REPORT_CHANNEL: "C092K6Z0EUT"
  KURTOSIS_CDK_COMMIT: "ad6f8769bf45ac115eefc2d22efb0701d0df729c"
  # The AggOracle committee v2 e2e needs a kurtosis-cdk that has the committee, and the commit above doesn't:
  # 0xPolygon/kurtosis-cdk#1044. Only that job uses this one, in every event (it doesn't follow "main" on schedule).
  # Replace it by the commit of the merge, or by "main", when the PR is merged
  KURTOSIS_CDK_COMMITTEE_V2_COMMIT: "06af11179fdd2c2a14b7b923bc0a390eb364e01a"
  # The commit of agglayer/agglayer-contracts (branch feature/agg-oracle-committee) that the job of the committee v2
  # builds its agglayer-contracts image from, while no image with the AggOracleCommittee v2 is published
  AGGLAYER_CONTRACTS_COMMITTEE_V2_COMMIT: "a6b96a86f8ec6345b2fa2f618f3f8c418c6c6d92"

jobs:
  get-kurtosis-cdk-commit:
    permissions:
      contents: read
    name: Get Kurtosis CDK Commit
    runs-on: ubuntu-latest
    outputs:
      kurtosis-commit: ${{ steps.get-commit.outputs.commit }}
    steps:
      - name: Determine kurtosis-cdk ref
        id: determine-ref
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "ref=main" >> $GITHUB_OUTPUT
            echo "Using latest kurtosis-cdk main branch"
          else
            echo "ref=${{ env.KURTOSIS_CDK_COMMIT }}" >> $GITHUB_OUTPUT
            echo "Using fixed kurtosis-cdk commit: ${{ env.KURTOSIS_CDK_COMMIT }}"
          fi

      - name: Checkout kurtosis-cdk
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          repository: 0xPolygon/kurtosis-cdk
          ref: ${{ steps.determine-ref.outputs.ref }}

      - name: Get kurtosis-cdk commit SHA
        id: get-commit
        run: |
          COMMIT=$(git rev-parse HEAD)
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "Using kurtosis-cdk commit: ${COMMIT}"

  build-aggkit-image:
    permissions:
      contents: read
    uses: ./.github/workflows/build-aggkit-image.yml
    with:
      go-version: 1.27.4
      docker-image-name: aggkit

  read-aggkit-args:
    permissions:
      contents: read
    name: Read aggkit args
    runs-on: ubuntu-latest
    outputs:
      # single l2 network (op-succinct)
      kurtosis-cdk-args-single-op-succinct: ${{ steps.read-args.outputs.op_succinct_args }}
      # single l2 network (op, pessimistic)
      kurtosis-cdk-args-single-op-pessimistic: ${{ steps.read-args.outputs.single_op_chain_pessimistic_args }}
      # single l2 network (op, AggOracle committee v2). It is enabled when the args set an agglayer-contracts image
      kurtosis-cdk-args-single-op-aggoracle-committee-v2: ${{ steps.read-args.outputs.single_op_chain_aggoracle_committee_v2_args }}
      committee-v2-enabled: ${{ steps.read-args.outputs.committee-v2-enabled }}
      committee-v2-kurtosis-ref: ${{ steps.read-args.outputs.committee-v2-kurtosis-ref }}
      # multi l2 networks
      kurtosis-cdk-args-1: ${{ steps.read-args.outputs.kurtosis-cdk-args-1 }}
      kurtosis-cdk-args-2: ${{ steps.read-args.outputs.kurtosis-cdk-args-2 }}
      kurtosis-cdk-args-3: ${{ steps.read-args.outputs.kurtosis-cdk-args-3 }}
      kurtosis-cdk-args-4: ${{ steps.read-args.outputs.kurtosis-cdk-args-4 }}
      kurtosis-cdk-args-5: ${{ steps.read-args.outputs.kurtosis-cdk-args-5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Read kurtosis-cdk-args from file
        id: read-args
        run: |
          BASE_OP=./.github/test_e2e_op_args_base.json
          BASE_CDK_ERIGON=./.github/test_e2e_cdk_erigon_args_base.json

          # Helper: merge provided JSON files, output to GITHUB_OUTPUT, and pretty print
          put_args() {
            local name="$1"
            shift
            local files=("$@")
            local content

            if [ "${#files[@]}" -eq 0 ]; then
              echo "❌ Error: put_args requires at least one JSON file" >&2
              exit 1
            fi

            # Verify that all files exist
            for f in "${files[@]}"; do
              if [ ! -f "$f" ]; then
                echo "❌ Error: JSON file not found: $f" >&2
                exit 1
              fi
            done

            content=$(jq -s 'reduce .[] as $item ({}; . * $item)' "${files[@]}" | jq -c .)
            LAST_ARGS="$content"

            echo "${name}=${content}" >> "$GITHUB_OUTPUT"
            echo "### $name"
            echo "$content" | jq .
          }

          # single l2 network (op-succinct)
          put_args op_succinct_args "$BASE_OP" \
            ./.github/test_e2e_op_succinct_args_base.json \
            ./.github/test_e2e_single_chain_op_succinct_args.json

          # single l2 network (op, pessimistic)
          put_args single_op_chain_pessimistic_args "$BASE_OP" \
            ./.github/test_e2e_op_args_chain_1.json

          # single l2 network (op, AggOracle committee v2). The job runs only if the args set the image of agglayer-contracts
          # that has the AggOracleCommittee v2 (agglayer_contracts_image). It is not published yet, so the args set an
          # image without a registry, that build-aggkit-committee-images builds
          put_args single_op_chain_aggoracle_committee_v2_args "$BASE_OP" \
            ./.github/test_e2e_op_args_chain_1.json \
            ./.github/test_e2e_op_aggoracle_committee_v2_args.json
          committee_v2_enabled=$(echo "$LAST_ARGS" | jq -r '((.args.agglayer_contracts_image // "") != "")')
          echo "committee-v2-enabled=${committee_v2_enabled}" >> "$GITHUB_OUTPUT"
          echo "committee-v2-kurtosis-ref=${KURTOSIS_CDK_COMMITTEE_V2_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "AggOracle committee v2 e2e enabled: ${committee_v2_enabled}"

          # multi l2 networks
          put_args kurtosis-cdk-args-1 "$BASE_OP" \
            ./.github/test_e2e_op_args_chain_1.json

          put_args kurtosis-cdk-args-2 "$BASE_OP" \
            ./.github/test_e2e_op_args_chain_2.json

          put_args kurtosis-cdk-args-3 "$BASE_CDK_ERIGON" \
            ./.github/test_e2e_cdk_erigon_custom_gas_token.json

          put_args kurtosis-cdk-args-4 "$BASE_CDK_ERIGON" \
            ./.github/test_e2e_cdk_erigon_multi_chains_args_2.json \
            ./.github/test_e2e_cdk_erigon_custom_gas_token.json

          put_args kurtosis-cdk-args-5 "$BASE_CDK_ERIGON" \
            ./.github/test_e2e_cdk_erigon_multi_chains_args_3.json

  # The agglayer/e2e workflow loads a single tar of images: the one of the committee job has aggkit and the GER validator
  # signer, both from this commit, and the agglayer-contracts image, so no image has to be published
  build-aggkit-committee-images:
    permissions:
      contents: read
    name: Build the images of the AggOracle committee v2
    needs:
      - build-aggkit-image
      - read-aggkit-args
    if: needs.read-aggkit-args.outputs.committee-v2-enabled == 'true'
    runs-on: amd-runner-2204
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # the version of the images comes from git describe
          persist-credentials: false

      - name: Download the aggkit image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: aggkit
          path: /tmp

      - name: Load the aggkit image
        run: docker load --input /tmp/aggkit.tar

      - name: Build the GER validator signer image
        run: make build-docker-ger_validator_signer

      # TEMPORARY, until an image of agglayer-contracts with the AggOracleCommittee v2 is published: an image without a
      # registry in the args (no "/") is built here from AGGLAYER_CONTRACTS_COMMITTEE_V2_COMMIT and travels in the archive.
      # It is cached, because it only changes with that commit or with its Dockerfile. Nothing is pushed.
      - name: Resolve the agglayer-contracts image
        id: contracts
        env:
          KURTOSIS_ARGS: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-single-op-aggoracle-committee-v2 }}
        run: |
          image=$(echo "$KURTOSIS_ARGS" | jq -r '.args.agglayer_contracts_image')
          if [[ "$image" == */* ]]; then
            echo "The agglayer-contracts image $image is published: kurtosis pulls it"
            echo "local=false" >> "$GITHUB_OUTPUT"
          else
            echo "The agglayer-contracts image $image is built here"
            echo "local=true" >> "$GITHUB_OUTPUT"
            echo "image=${image}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the agglayer-contracts image from the cache
        if: steps.contracts.outputs.local == 'true'
        id: contracts-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: /tmp/agglayer-contracts.tar.gz
          key: agglayer-contracts-${{ steps.contracts.outputs.image }}-${{ env.AGGLAYER_CONTRACTS_COMMITTEE_V2_COMMIT }}-${{ hashFiles('test/e2e/kurtosis/agglayer-contracts-committee-v2.Dockerfile') }}

      - name: Checkout agglayer-contracts
        if: steps.contracts.outputs.local == 'true' && steps.contracts-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: agglayer/agglayer-contracts
          ref: ${{ env.AGGLAYER_CONTRACTS_COMMITTEE_V2_COMMIT }}
          path: agglayer-contracts
          persist-credentials: false

      - name: Build the agglayer-contracts image
        if: steps.contracts.outputs.local == 'true' && steps.contracts-cache.outputs.cache-hit != 'true'
        env:
          CONTRACTS_IMAGE: ${{ steps.contracts.outputs.image }}
        run: |
          # The contracts are compiled in a container and not in the build of the image (see the Dockerfile)
          # and the files are given back to the user of the runner, so it can clean the workspace
          docker run --rm --volume "$PWD/agglayer-contracts:/opt/agglayer-contracts" --workdir /opt/agglayer-contracts \
            --env OWNER="$(id -u):$(id -g)" node:24.19.0-bookworm \
            bash -c 'npm install --global npm@10.9.0 && npm install && npx hardhat compile && chown -R "$OWNER" .'
          mkdir /tmp/empty-context
          docker build --tag "$CONTRACTS_IMAGE" --build-context contracts="$PWD/agglayer-contracts" \
            --file test/e2e/kurtosis/agglayer-contracts-committee-v2.Dockerfile /tmp/empty-context
          docker save "$CONTRACTS_IMAGE" | gzip -1 > /tmp/agglayer-contracts.tar.gz

      - name: Load the agglayer-contracts image
        if: steps.contracts.outputs.local == 'true' && steps.contracts-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/agglayer-contracts.tar.gz

      # The archive is compressed (docker load reads it as it is) because the agglayer-contracts image has 4 GB
      - name: Save the images in a single archive
        env:
          CONTRACTS_IMAGE: ${{ steps.contracts.outputs.image }}
        run: |
          # shellcheck disable=SC2086 # CONTRACTS_IMAGE is empty when the image is a published one
          docker save aggkit ger_validator_signer $CONTRACTS_IMAGE | gzip -1 > /tmp/aggkit-committee.tar

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aggkit-committee
          path: /tmp/aggkit-committee.tar
          compression-level: 0

  build-tools:
    permissions:
      contents: read
    name: Build aggsender find imported bridge tool
    needs:
      - build-aggkit-image
    runs-on: amd-runner-2204
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: 1.27.4
      - name: Build Aggsender Find Imported Bridge
        run: make build-tools
      - name: Upload Binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aggsender_find_imported_bridge
          path: ./target/aggsender_find_imported_bridge
      # aggkit owns the kurtosis e2e config templates (test/e2e/kurtosis/). They
      # are uploaded here and overlaid on kurtosis-cdk's static_files by the
      # agglayer/e2e reusable workflows (input: aggkit-config-artifact), so a
      # config change ships in the same PR as the code — no kurtosis-cdk PR.
      - name: Upload aggkit e2e config templates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aggkit-e2e-config
          path: ./test/e2e/kurtosis/*.template.toml

  test-single-l2-network-op-pessimistic:
    permissions:
      contents: read
      packages: read
      id-token: write
    name: Single L2 chain tests (OP, pessimistic)
    needs:
      - build-aggkit-image
      - build-tools
      - read-aggkit-args
      - get-kurtosis-cdk-commit
    uses: agglayer/e2e/.github/workflows/aggkit-e2e-single-chain.yml@75202d2d38153691332b49b5424796dc5fd5b32a  # agglayer/e2e main
    secrets:
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_GHA_RECORD_E2E_TEST_RUN }}
    with:
      kurtosis-cdk-ref: ${{ needs.get-kurtosis-cdk-commit.outputs.kurtosis-commit }}
      agglayer-e2e-ref: 75202d2d38153691332b49b5424796dc5fd5b32a # agglayer/e2e main
      # aggkit-owned config templates overlaid onto kurtosis-cdk before it runs.
      aggkit-config-artifact: aggkit-e2e-config
      kurtosis-cdk-enclave-name: op
      kurtosis-cdk-args: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-single-op-pessimistic }}
      test-name: "test-single-l2-network-op-pessimistic"
      execute-all-tests: ${{ github.event_name == 'schedule' }}
      fail-fast: ${{ github.event_name != 'schedule' }}
      aggsender-find-imported-bridge-artifact: aggsender_find_imported_bridge

  check-single-l2-network-op-pessimistic-tests-result:
    permissions:
      contents: read
    name: Check results for single l2 network (OP, pessimistic)
    needs:
      - test-single-l2-network-op-pessimistic
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-single-l2-network-op-pessimistic.result) }}

  test-single-l2-network-op-succinct:
    permissions:
      contents: read
      packages: read
      id-token: write
    name: Single L2 chain tests (op-succinct)
    needs:
      - build-aggkit-image
      - build-tools
      - read-aggkit-args
      - get-kurtosis-cdk-commit
    uses: agglayer/e2e/.github/workflows/aggkit-e2e-single-chain.yml@75202d2d38153691332b49b5424796dc5fd5b32a  # agglayer/e2e main
    secrets:
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_GHA_RECORD_E2E_TEST_RUN }}
    with:
      kurtosis-cdk-ref: ${{ needs.get-kurtosis-cdk-commit.outputs.kurtosis-commit }}
      agglayer-e2e-ref: 75202d2d38153691332b49b5424796dc5fd5b32a # agglayer/e2e main
      # aggkit-owned config templates overlaid onto kurtosis-cdk before it runs.
      aggkit-config-artifact: aggkit-e2e-config
      kurtosis-cdk-enclave-name: op
      kurtosis-cdk-args: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-single-op-succinct }}
      aggsender-find-imported-bridge-artifact: aggsender_find_imported_bridge
      test-name: "test-single-l2-network-op-succinct"
      execute-all-tests: ${{ github.event_name == 'schedule' }}
      fail-fast: ${{ github.event_name != 'schedule' }}

  check-single-network-op-succinct-tests-result:
    permissions:
      contents: read
    name: Check results for single l2 network (op-succinct)
    needs:
      - test-single-l2-network-op-succinct
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-single-l2-network-op-succinct.result) }}

  test-single-l2-network-op-aggoracle-committee-v2:
    permissions:
      contents: read
      packages: read
      id-token: write
    name: Single L2 chain tests (OP, AggOracle committee v2)
    needs:
      - build-aggkit-committee-images
      - build-tools
      - read-aggkit-args
    if: needs.read-aggkit-args.outputs.committee-v2-enabled == 'true'
    uses: agglayer/e2e/.github/workflows/aggkit-e2e-single-chain.yml@8bb477158865565108e5a9e9fb779cbfe6a8e3ee  # agglayer/e2e#277 (committee v2 tests)
    secrets:
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_GHA_RECORD_E2E_TEST_RUN }}
    with:
      # The commit of kurtosis-cdk with the committee v2, not the one of the other jobs
      kurtosis-cdk-ref: ${{ needs.read-aggkit-args.outputs.committee-v2-kurtosis-ref }}
      # The commit of agglayer/e2e with the committee v2 tests. Pin it to the merge commit once agglayer/e2e#277 is merged.
      agglayer-e2e-ref: 8bb477158865565108e5a9e9fb779cbfe6a8e3ee # agglayer/e2e#277 (committee v2 tests)
      # aggkit-owned config templates overlaid onto kurtosis-cdk before it runs.
      aggkit-config-artifact: aggkit-e2e-config
      kurtosis-cdk-enclave-name: op
      kurtosis-cdk-args: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-single-op-aggoracle-committee-v2 }}
      # The tar with aggkit:local and ger_validator_signer:local
      docker-artifact-name: aggkit-committee
      aggsender-find-imported-bridge-artifact: aggsender_find_imported_bridge
      test-name: "test-single-l2-network-op-aggoracle-committee-v2"
      execute-all-tests: ${{ github.event_name == 'schedule' }}
      fail-fast: ${{ github.event_name != 'schedule' }}

  check-single-l2-network-op-aggoracle-committee-v2-tests-result:
    permissions:
      contents: read
    name: Check results for single l2 network (OP, AggOracle committee v2)
    needs:
      - test-single-l2-network-op-aggoracle-committee-v2
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-single-l2-network-op-aggoracle-committee-v2.result) }}

  test-multi-l2-networks-2-chains-op-pessimistic:
    permissions:
      contents: read
    name: Multi chains E2E tests (OP, pessimistic, 2 chains)
    needs:
      - build-aggkit-image
      - build-tools
      - read-aggkit-args
      - get-kurtosis-cdk-commit
    uses: ./.github/workflows/test-e2e-multi-chains.yml
    secrets:
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_GHA_RECORD_E2E_TEST_RUN }}
    with:
      kurtosis-cdk-ref: ${{ needs.get-kurtosis-cdk-commit.outputs.kurtosis-commit }}
      agglayer-e2e-ref: 75202d2d38153691332b49b5424796dc5fd5b32a # agglayer/e2e main
      # aggkit-owned config templates overlaid onto kurtosis-cdk before it runs.
      aggkit-config-artifact: aggkit-e2e-config
      kurtosis-cdk-enclave-name: op
      aggsender-find-imported-bridge-artifact: aggsender_find_imported_bridge
      kurtosis-cdk-args-1: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-1 }}
      kurtosis-cdk-args-2: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-2 }}

  check-multi-l2-networks-2-chains-tests-result:
    permissions:
      contents: read
    name: Check results for multi l2 networks (OP, pessimistic, 2 chains)
    needs:
      - test-multi-l2-networks-2-chains-op-pessimistic
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-multi-l2-networks-2-chains-op-pessimistic.result) }}

  test-multi-l2-networks-3-chains-cdk-erigon-pessimistic:
    permissions:
      contents: read
    name: Multi chains E2E tests (CDK Erigon, pessimistic, 3 chains)
    needs:
      - build-aggkit-image
      - build-tools
      - read-aggkit-args
      - get-kurtosis-cdk-commit
    uses: ./.github/workflows/test-e2e-multi-chains.yml
    secrets:
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_GHA_RECORD_E2E_TEST_RUN }}
    with:
      kurtosis-cdk-ref: ${{ needs.get-kurtosis-cdk-commit.outputs.kurtosis-commit }}
      agglayer-e2e-ref: 75202d2d38153691332b49b5424796dc5fd5b32a # agglayer/e2e main
      # aggkit-owned config templates overlaid onto kurtosis-cdk before it runs.
      aggkit-config-artifact: aggkit-e2e-config
      kurtosis-cdk-enclave-name: aggkit
      aggsender-find-imported-bridge-artifact: aggsender_find_imported_bridge
      kurtosis-cdk-args-1: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-3 }}
      kurtosis-cdk-args-2: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-4 }}
      kurtosis-cdk-args-3: ${{ needs.read-aggkit-args.outputs.kurtosis-cdk-args-5 }}
      number-of-chains: 3

  check-multi-l2-networks-3-chains-tests-result:
    permissions:
      contents: read
    name: Check results for multi l2 networks (CDK Erigon, pessimisstic, 3 chains)
    needs:
      - test-multi-l2-networks-3-chains-cdk-erigon-pessimistic
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-multi-l2-networks-3-chains-cdk-erigon-pessimistic.result) }}

  notify-slack:
    permissions:
      contents: read
    name: Notify Slack
    needs:
      - test-single-l2-network-op-pessimistic
      - test-single-l2-network-op-succinct
      - test-single-l2-network-op-aggoracle-committee-v2
      - test-multi-l2-networks-2-chains-op-pessimistic
      - test-multi-l2-networks-3-chains-cdk-erigon-pessimistic
      - get-kurtosis-cdk-commit
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/develop'
    steps:
      - name: Send Slack notification
        uses: agglayer/gha-notify-generic@14fab4a0e1b4b9908d187e87cee5f6d88935660f  # v1.0.0
        with:
          slack-bot-token: ${{ secrets.SLACK_APP_TOKEN_AGGLAYER_NOTIFY_GENERIC }}
          channel-id: ${{ env.AGGKIT_REPORT_CHANNEL }}
          message: |
            Daily E2E Tests Report

            Kurtosis CDK Commit: `${{ needs.get-kurtosis-cdk-commit.outputs.kurtosis-commit }}`

            Test Results:
            • Single L2 (OP, pessimistic): ${{ needs.test-single-l2-network-op-pessimistic.result == 'success' && '🟢' || '🔴' }}
            • Single L2 (op-succinct): ${{ needs.test-single-l2-network-op-succinct.result == 'success' && '🟢' || '🔴' }}
            • Single L2 (OP, AggOracle committee v2): ${{ needs.test-single-l2-network-op-aggoracle-committee-v2.result == 'success' && '🟢' || needs.test-single-l2-network-op-aggoracle-committee-v2.result == 'skipped' && '⏭️' || '🔴' }}
            • Multi L2 (OP, pessimistic, 2 chains): ${{ needs.test-multi-l2-networks-2-chains-op-pessimistic.result == 'success' && '🟢' || '🔴' }}
            • Multi L2 (OP, pessimistic, 3 chains): ${{ needs.test-multi-l2-networks-3-chains-cdk-erigon-pessimistic.result == 'success' && '🟢' || '🔴' }}

            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>
