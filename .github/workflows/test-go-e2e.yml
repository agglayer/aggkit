name: Go E2E Tests

on:
  pull_request: {}
  workflow_dispatch: {}
  # Heavy envs (op-fep, op-fep-committee, op-pp-2chains, cdk-erigon-3chains) run
  # on this nightly schedule and on manual dispatch, not on every PR (see the
  # setup-matrix job's env-name gating below).
  schedule:
    - cron: "0 2 * * *"  # Run at 2 AM UTC daily

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # P11: Emit the env_name matrix dynamically so heavy envs are gated by trigger.
  # On pull_request only the light, fully-published env (op-pp) runs so PRs stay
  # fast; on schedule (nightly) and workflow_dispatch all five envs run. The same
  # JSON feeds both the pull-docker-images and test-go-e2e matrices so their legs
  # stay one-to-one (test-go-e2e needs: the matching pull-docker-images artifact).
  setup-matrix:
    name: Compute env matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      env_names: ${{ steps.set.outputs.env_names }}
    steps:
      - name: Select env_name list by trigger
        id: set
        run: |
          # op-pp uses fully-published images and is the fast PR gate. The four
          # heavy envs (FEP prover/committee, multi-chain) are heavier and depend
          # on env snapshot images, so they run only on nightly schedule / manual
          # dispatch to keep PR runs fast.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            env_names='["op-pp"]'
          else
            env_names='["op-pp","op-fep","op-fep-committee","op-pp-2chains","cdk-erigon-3chains"]'
          fi
          echo "env_names=${env_names}" >> "$GITHUB_OUTPUT"
          echo "Selected env_names (${{ github.event_name }}): ${env_names}"

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: make build-docker

      - name: Save Docker image
        run: docker save aggkit:local -o /tmp/aggkit-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggkit-docker-image
          path: /tmp/aggkit-image.tar
          retention-days: 1

  pull-docker-images:
    name: Pull Docker Images (${{ matrix.env_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        # P11: env_name list comes from setup-matrix (op-pp on PR; all five on
        # schedule/dispatch). Kept identical to the test-go-e2e job matrix.
        env_name: ${{ fromJSON(needs.setup-matrix.outputs.env_names) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pull Docker images from compose file
        working-directory: test/e2e/envs/${{ matrix.env_name }}
        run: |
          # Derive the image list dynamically from the selected env's compose file
          # (excluding the locally-built aggkit image) so no service names are hardcoded.
          images=$(docker compose config --images | grep -v 'aggkit:local')
          echo "Images to pull: $images"
          docker compose pull $images

      - name: Save pulled Docker images
        working-directory: test/e2e/envs/${{ matrix.env_name }}
        run: |
          # Re-derive the same image list and save exactly those images (never aggkit:local).
          images=$(docker compose config --images | grep -v 'aggkit:local')
          echo "Images to save: $images"
          docker save $images -o /tmp/docker-images.tar

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          # Per-env artifact name so multiple matrix entries (added in P11) never collide.
          name: pulled-docker-images-${{ matrix.env_name }}
          path: /tmp/docker-images.tar
          retention-days: 1

  test-go-e2e:
    name: Run Go E2E Tests (${{ matrix.env_name }})
    runs-on: ubuntu-latest
    # 120 min: the go test -timeout is 90m (make test-e2e), leaving 30m for runner setup,
    # docker image loading, and the artifact-upload step so GH Actions never kills the job
    # before go test exits cleanly and logs are collected.
    timeout-minutes: 120
    needs: [setup-matrix, build-docker-image, pull-docker-images]
    strategy:
      fail-fast: false
      matrix:
        # P11: same env_name list as the pull-docker-images job matrix (from
        # setup-matrix) so each test-go-e2e leg needs: the matching
        # pull-docker-images artifact.
        env_name: ${{ fromJSON(needs.setup-matrix.outputs.env_names) }}
    env:
      # Selects the env directory under test/e2e/envs/<env_name> and is consumed by
      # make test-e2e -> TestMain (envs.ParseENVName). Unset defaults to op-pp.
      E2E_ENV: ${{ matrix.env_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.7

      - name: Verify Docker Compose plugin
        run: |
          # The test code uses `docker compose` (v2 plugin syntax via exec.Command("docker", "compose", ...)).
          # Ubuntu runners ship with the v2 plugin pre-installed; this step verifies it is available
          # and does NOT install the legacy v1 docker-compose standalone binary (which would shadow the
          # plugin and break the compose commands in loader.go).
          docker compose version

      - name: Download aggkit Docker image
        uses: actions/download-artifact@v4
        with:
          name: aggkit-docker-image
          path: /tmp

      - name: Download pulled Docker images
        uses: actions/download-artifact@v4
        with:
          # Match the per-env artifact name produced by pull-docker-images.
          name: pulled-docker-images-${{ matrix.env_name }}
          path: /tmp

      - name: Load Docker images
        run: |
          docker load -i /tmp/aggkit-image.tar
          docker load -i /tmp/docker-images.tar

      - name: Run E2E tests
        run: make test-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-env results artifact so matrix entries do not collide.
          name: e2e-test-results-${{ matrix.env_name }}
          path: |
            test/e2e/*.log
            test/e2e/envs/**/logs/
          if-no-files-found: ignore
