name: Go E2E Tests

on:
  pull_request: {}
  workflow_dispatch: {}
  # Uncomment to run on schedule (e.g., nightly)
  # schedule:
  #   - cron: "0 2 * * *"  # Run at 2 AM UTC daily

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: make build-docker

      - name: Save Docker image
        run: docker save aggkit:local -o /tmp/aggkit-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggkit-docker-image
          path: /tmp/aggkit-image.tar
          retention-days: 1

  pull-docker-images:
    name: Pull Docker Images (${{ matrix.env_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        env_name:
          - op-pp
          # P11: append new env names here, one list item each, as pure data:
          #   - op-fep
          #   - op-fep-committee
          #   - op-pp-2chains
          #   - cdk-erigon-3chains
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pull Docker images from compose file
        working-directory: test/e2e/envs/${{ matrix.env_name }}
        run: |
          # Derive the image list dynamically from the selected env's compose file
          # (excluding the locally-built aggkit image) so no service names are hardcoded.
          images=$(docker compose config --images | grep -v 'aggkit:local')
          echo "Images to pull: $images"
          docker compose pull $images

      - name: Save pulled Docker images
        working-directory: test/e2e/envs/${{ matrix.env_name }}
        run: |
          # Re-derive the same image list and save exactly those images (never aggkit:local).
          images=$(docker compose config --images | grep -v 'aggkit:local')
          echo "Images to save: $images"
          docker save $images -o /tmp/docker-images.tar

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          # Per-env artifact name so multiple matrix entries (added in P11) never collide.
          name: pulled-docker-images-${{ matrix.env_name }}
          path: /tmp/docker-images.tar
          retention-days: 1

  test-go-e2e:
    name: Run Go E2E Tests (${{ matrix.env_name }})
    runs-on: ubuntu-latest
    # Raised from 45 to 90 to accommodate heavier multi-container envs (kept consistent with
    # the go test -timeout in the Makefile's test-e2e target).
    timeout-minutes: 90
    needs: [build-docker-image, pull-docker-images]
    strategy:
      fail-fast: false
      matrix:
        env_name:
          - op-pp
          # P11: append the same new env names here, one list item each, as pure data:
          #   - op-fep
          #   - op-fep-committee
          #   - op-pp-2chains
          #   - cdk-erigon-3chains
    env:
      # Selects the env directory under test/e2e/envs/<env_name> and is consumed by
      # make test-e2e -> TestMain (envs.ParseENVName). Unset defaults to op-pp.
      E2E_ENV: ${{ matrix.env_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.7

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Download aggkit Docker image
        uses: actions/download-artifact@v4
        with:
          name: aggkit-docker-image
          path: /tmp

      - name: Download pulled Docker images
        uses: actions/download-artifact@v4
        with:
          # Match the per-env artifact name produced by pull-docker-images.
          name: pulled-docker-images-${{ matrix.env_name }}
          path: /tmp

      - name: Load Docker images
        run: |
          docker load -i /tmp/aggkit-image.tar
          docker load -i /tmp/docker-images.tar

      - name: Run E2E tests
        run: make test-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-env results artifact so matrix entries do not collide.
          name: e2e-test-results-${{ matrix.env_name }}
          path: |
            test/e2e/*.log
            test/e2e/envs/**/logs/
          if-no-files-found: ignore
