name: Go Vulnerability Check

on:
    push: {}
    workflow_call: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    govulncheck_job:
        runs-on: ubuntu-latest
        name: Run govulncheck
        steps:
            - id: govulncheck
              uses: golang/govulncheck-action@v1
              with:
                  go-version-input: 1.25.0
                  go-package: ./...
