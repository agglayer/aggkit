name: Test Unit

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-unit:
    permissions:
      contents: read
    name: test-unit
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.27.4]
        goarch: ["amd64"]
    runs-on: amd-runner-2204
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
        env:
          GOARCH: ${{ matrix.goarch }}

      - name: Test
        run: make test-unit

      # ger_validator_signer is its own Go module: `make test-unit` doesn't run its tests
      - name: Test ger_validator_signer
        run: make test-unit-ger_validator_signer
