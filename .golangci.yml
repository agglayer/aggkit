version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - dogsled
    - dupl
    - errcheck
    - errname
    - errorlint
    - forcetypeassert
    - goconst
    - gocritic
    - gosec
    - importas
    - lll
    - makezero
    - misspell
    - mnd
    - nolintlint
    - prealloc
    - predeclared
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-checks:
        - ruleguard
      disabled-checks:
        - ifElseChain
    gosec:
      excludes:
        - G115
        - G204  # subprocess with tainted args — controlled via config/CLI
        - G602  # slice OOB — false positive in taint analysis
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
          - lll
          - mnd
          - unparam
        path: (_test\.go|^test/.*)
      - linters:
          - dupl
        path: etherman/contracts/contracts_(banana|elderberry)\.go
      - linters:
          - gosec
        text: "G703"  # path traversal false positive — not a valid rule ID in golangci-lint v2.4.0
      - linters:
          - gosec
        text: "G118"  # context cancel false positive — not a valid rule ID in golangci-lint v2.4.0
    paths:
      - tests
      - third_party$
      - builtin$
      - examples$
issues:
  whole-files: true
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - tests
      - third_party$
      - builtin$
      - examples$
