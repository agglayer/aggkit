basePath: /autoclaim/v1
definitions:
  api.DecisionRequest:
    properties:
      decider:
        example: operator
        type: string
      decider_id:
        example: alice
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      reason:
        example: approved by operator
        type: string
    type: object
  api.DecisionResponse:
    properties:
      created_at:
        type: string
      decider:
        type: string
      decider_id:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      policy_name:
        type: string
      reason:
        type: string
      result:
        type: string
      updated_at:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        example: request 0:1:42 not found
        type: string
    type: object
  api.ListResponse:
    properties:
      bridges:
        items:
          $ref: '#/definitions/api.RequestResponse'
        type: array
      count:
        type: integer
      page_number:
        type: integer
      page_size:
        type: integer
    type: object
  api.RequestResponse:
    properties:
      amount:
        type: string
      block_num:
        type: integer
      block_pos:
        type: integer
      block_timestamp:
        type: integer
      bridge_tx_hash:
        type: string
      claim_tx_hash:
        type: string
      created_at:
        type: string
      deposit_count:
        type: integer
      destination_address:
        type: string
      destination_network:
        type: integer
      global_index:
        type: string
      id:
        type: string
      l1_info_tree_index:
        type: integer
      last_error:
        type: string
      last_observed_result_at:
        type: string
      last_observed_send_at:
        type: string
      leaf_type:
        type: integer
      manual_decision:
        $ref: '#/definitions/api.DecisionResponse'
      max_retries:
        type: integer
      metadata:
        type: string
      origin_address:
        type: string
      origin_network:
        type: integer
      policy_decision:
        $ref: '#/definitions/api.DecisionResponse'
      policy_status:
        type: string
      retry_count:
        type: integer
      status:
        type: string
      to_address:
        type: string
      tx_manager_id:
        type: string
      txn_sender:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact:
    name: API Support
    url: https://polygon.technology/
  description: API documentation for the Auto Claim service
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Auto Claim API
  version: "1.0"
paths:
  /bridges:
    get:
      description: Returns tracked Auto Claim requests with optional filters and pagination.
      parameters:
      - description: Filter by origin network ID
        format: int32
        in: query
        name: origin_network
        type: integer
      - description: Filter by destination network ID
        format: int32
        in: query
        name: destination_network
        type: integer
      - description: Filter by request status
        in: query
        name: status
        type: string
      - description: Filter by policy result
        in: query
        name: policy_status
        type: string
      - description: Alias for policy_status
        in: query
        name: policy_result
        type: string
      - description: Filter by 0x-prefixed bridge transaction hash
        in: query
        name: bridge_tx_hash
        type: string
      - description: Filter by 0x-prefixed claim transaction hash
        in: query
        name: claim_tx_hash
        type: string
      - description: Filter by minimum bridge block number
        format: int64
        in: query
        name: from_block
        type: integer
      - description: Filter by maximum bridge block number
        format: int64
        in: query
        name: to_block
        type: integer
      - description: Page number (default 0)
        format: int32
        in: query
        name: page_number
        type: integer
      - description: Page size (default 100)
        format: int32
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List Auto Claim bridge requests
      tags:
      - autoclaim
  /bridges/{id}:
    get:
      description: Returns one tracked Auto Claim request by request ID.
      parameters:
      - description: Auto Claim request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get Auto Claim bridge request
      tags:
      - autoclaim
  /bridges/{id}/approve:
    post:
      consumes:
      - application/json
      description: Approves a request currently in manual-approval-required and advances
        the matching claimer when present.
      parameters:
      - description: Auto Claim request ID
        in: path
        name: id
        required: true
        type: string
      - description: Manual approval metadata
        in: body
        name: decision
        schema:
          $ref: '#/definitions/api.DecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Approve Auto Claim bridge request
      tags:
      - autoclaim
  /bridges/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a request currently in manual-approval-required and advances
        the matching claimer when present.
      parameters:
      - description: Auto Claim request ID
        in: path
        name: id
        required: true
        type: string
      - description: Manual rejection metadata
        in: body
        name: decision
        schema:
          $ref: '#/definitions/api.DecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Reject Auto Claim bridge request
      tags:
      - autoclaim
swagger: "2.0"
