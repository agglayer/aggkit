basePath: /bridge/v1
definitions:
  bridgesync.LastReorg:
    properties:
      detected_at:
        type: integer
      from_block:
        type: integer
      to_block:
        type: integer
    type: object
  github_com_agglayer_aggkit_bridgeservice_types.ClaimProof:
    description: Claim proof structure for verifying claims in the bridge
    properties:
      l1_info_tree_leaf:
        allOf:
        - $ref: '#/definitions/types.L1InfoTreeLeafResponse'
        description: L1 info tree leaf data associated with the claim
      proof_local_exit_root:
        description: Merkle proof for the local exit root
        example:
        - '[0x1'
        - ' 0x2'
        - ' 0x3...]'
        items:
          type: string
        type: array
      proof_rollup_exit_root:
        description: Merkle proof for the rollup exit root
        example:
        - '[0x4'
        - ' 0x5'
        - ' 0x6...]'
        items:
          type: string
        type: array
    type: object
  github_com_agglayer_aggkit_bridgeservice_types.HealthCheckResponse:
    description: Contains basic health‐check information for the bridge service
    properties:
      status:
        type: string
      time:
        type: string
      version:
        type: string
    type: object
  types.BridgeResponse:
    description: Detailed information about a bridge event
    properties:
      amount:
        description: Amount of tokens being bridged
        example: "1000000000000000000"
        type: string
      block_num:
        description: Block number where the bridge event was recorded
        example: 1234
        type: integer
      block_pos:
        description: Position of the bridge event within the block
        example: 1
        type: integer
      block_timestamp:
        description: Timestamp of the block containing the bridge event
        example: 1684500000
        type: integer
      bridge_hash:
        description: Unique hash representing the bridge event, often used as an identifier
        example: 0xabc1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcd
        type: string
      deposit_count:
        description: Count of total deposits processed so far for the given token/address
        example: 10
        type: integer
      destination_address:
        description: Address of the token receiver on the destination network
        example: 0xdef4567890abcdef1234567890abcdef12345678
        type: string
      destination_network:
        description: ID of the network where the bridge transaction is destined
        example: 42161
        type: integer
      from_address:
        description: |-
          Address that initiated the transaction on bridge contract. It can be intermediary contract or EOA.
          May be null if bridge was synced with SyncFromInBridges=false
        example: 0xabc1234567890abcdef1234567890abcdef1234
        type: string
      global_index:
        description: Global index of the bridge event (consisted of mainnet flag,
          rollup id and deposit count)
        example: "4294967296"
        type: string
      leaf_type:
        description: Type of leaf (bridge event type) used in the tree structure
        example: 1
        type: integer
      metadata:
        description: Optional metadata attached to the bridge event
        example: "0xdeadbeef"
        type: string
      origin_address:
        description: Address of the token sender on the origin network
        example: 0xabc1234567890abcdef1234567890abcdef1234
        type: string
      origin_network:
        description: ID of the network where the bridge transaction originated
        example: 10
        type: integer
      to_address:
        description: Address of the contract that was the recipient of the transaction.
          This may differ from the bridge contract address.
        example: 0xF9D64d54D32EE2BDceAAbFA60C4C438E224427d0
        type: string
      tx_hash:
        description: Hash of the transaction that included the bridge event
        example: 0xdef4567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
        type: string
      txn_sender:
        description: Address of the transaction sender who initiated the bridge transaction
        example: 0xabc1234567890abcdef1234567890abcdef12345
        type: string
    type: object
  types.BridgesByContentResult:
    description: Response containing bridge events matching specific content fields
    properties:
      bridges:
        description: List of bridges matching the content query
        items:
          $ref: '#/definitions/types.BridgeResponse'
        type: array
      count:
        description: Total number of matching bridges
        example: 2
        type: integer
    type: object
  types.BridgesResult:
    description: Paginated response of bridge events
    properties:
      bridges:
        description: List of bridge events
        items:
          $ref: '#/definitions/types.BridgeResponse'
        type: array
      count:
        description: Total number of bridge events
        example: 42
        type: integer
    type: object
  types.ClaimCandidateResponse:
    description: A bridge event that is a candidate for claiming
    properties:
      bridge:
        allOf:
        - $ref: '#/definitions/types.BridgeResponse'
        description: The bridge event that is a candidate for claiming
    type: object
  types.ClaimCandidatesResult:
    description: Paginated response of claim candidates (bridge events)
    properties:
      claim_candidates:
        description: List of claim candidates
        items:
          $ref: '#/definitions/types.ClaimCandidateResponse'
        type: array
      count:
        description: Total number of matching claim candidates
        example: 5
        type: integer
    type: object
  types.ClaimResponse:
    description: Detailed information about a claim event
    properties:
      amount:
        description: Amount claimed
        example: "1000000000000000000"
        type: string
      block_num:
        description: Block number where the claim was processed
        example: 1234
        type: integer
      block_timestamp:
        description: Timestamp of the block containing the claim
        example: 1684500000
        type: integer
      destination_address:
        description: Address receiving the claim on the destination network
        example: 0xdef4567890abcdef1234567890abcdef12345678
        type: string
      destination_network:
        description: Destination network ID where the claim was processed
        example: 42161
        type: integer
      from_address:
        description: Address from which the claim originated
        example: 0xabc1234567890abcdef1234567890abcdef1234
        type: string
      global_exit_root:
        description: Global exit root associated with the claim
        example: 0x27ae5ba08d7291c96c8cbddcc148bf48a6d68c7974b94356f53754ef6171d757
        type: string
      global_index:
        description: Global index of the claim
        example: "1000000000000000000"
        type: string
      is_message:
        description: IsMessage indicates whether this is a message claim (leaf type
          1) rather than an asset claim (leaf type 0)
        example: false
        type: boolean
      mainnet_exit_root:
        description: Mainnet exit root associated with the claim
        example: 0x27ae5ba08d7291c96c8cbddcc148bf48a6d68c7974b94356f53754ef6171d757
        type: string
      metadata:
        description: Metadata associated with the claim
        example: "0xdeadbeef"
        type: string
      origin_address:
        description: Address initiating the claim on the origin network
        example: 0xabc1234567890abcdef1234567890abcdef1234
        type: string
      origin_network:
        description: Origin network ID where the claim was initiated
        example: 10
        type: integer
      proof_local_exit_root:
        description: Proof local exit root associated with the claim (optional)
        example:
        - '[0x1'
        - ' 0x2'
        - ' 0x3...]'
        items:
          type: string
        type: array
      proof_rollup_exit_root:
        description: Proof rollup exit root associated with the claim (optional)
        example:
        - '[0x4'
        - ' 0x5'
        - ' 0x6...]'
        items:
          type: string
        type: array
      rollup_exit_root:
        description: Rollup exit root associated with the claim
        example: 0x27ae5ba08d7291c96c8cbddcc148bf48a6d68c7974b94356f53754ef6171d757
        type: string
      tx_hash:
        description: Transaction hash associated with the claim
        example: 0xdef4567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
        type: string
    type: object
  types.ClaimsByGERResult:
    description: Response containing claim events matching a specific global exit
      root
    properties:
      claims:
        description: List of claims matching the global exit root
        items:
          $ref: '#/definitions/types.ClaimResponse'
        type: array
      count:
        description: Total number of matching claims
        example: 3
        type: integer
    type: object
  types.ClaimsResult:
    description: Paginated response containing claim events and total count
    properties:
      claims:
        description: List of claims matching the query
        items:
          $ref: '#/definitions/types.ClaimResponse'
        type: array
      count:
        description: Total number of matching claims
        example: 42
        type: integer
    type: object
  types.ErrorResponse:
    description: Generic error response structure
    properties:
      error:
        example: Error message
        type: string
    type: object
  types.L1ContractsConfig:
    description: L1 smart contract addresses
    properties:
      BridgeAddr:
        description: BridgeAddr is the address of the bridge smart contract on L1
        example: 0xabcdef1234567890abcdef1234567890abcdef12
        type: string
      GlobalExitRootAddr:
        description: GlobalExitRootAddr is the address of the GlobalExitRoot manager
          contract on L1
        example: 0xabcdef1234567890abcdef1234567890abcdef12
        type: string
      RollupManagerAddr:
        description: RollupManagerAddr is the address of the RollupManager/AgglayerManager
          contract
        example: 0xabcdef1234567890abcdef1234567890abcdef12
        type: string
    type: object
  types.L1InfoTreeLeafResponse:
    properties:
      block_num:
        description: Block number where the leaf was recorded
        example: 123456
        type: integer
      block_pos:
        description: Position of the leaf in the block (used for ordering)
        example: 5
        type: integer
      global_exit_root:
        description: |-
          Global exit root computed from mainnet and rollup roots
          @example "0x4567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef123"
        type: string
      hash:
        description: Unique hash identifying this leaf node
        example: 0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
        type: string
      injected_l2_block_num:
        description: |-
          Block number on the destination (L2) network where this Global Exit Root was injected.
          Only set by the injected-l1-info-leaf endpoint when network_id is the L2's own; nil for an
          L1 (network_id=0) lookup, where BlockNumber above already is the relevant block.
          Approximate (the current polling head, not necessarily the real injection block) for L2
          chains synced by l2gersync in Legacy mode
        example: 654321
        type: integer
      injected_l2_block_timestamp:
        description: |-
          Timestamp of the L2 block above, in seconds since the Unix epoch. Only set alongside
          InjectedL2BlockNumber; may briefly be nil for a row written before l2gersync persisted
          timestamps if backfilling it from the L2 RPC failed (transient), in which case it resolves
          on a later request. Always nil for L2 chains synced by l2gersync in Legacy mode, where
          InjectedL2BlockNumber is only approximate and no accurate timestamp can be derived from it
        example: 1684500123
        type: integer
      l1_info_tree_index:
        description: Index of this leaf in the L1 info tree
        example: 42
        type: integer
      mainnet_exit_root:
        description: Mainnet exit root at this leaf
        example: 0xdefc...789
        type: string
      previous_block_hash:
        description: Hash of the previous block in the tree
        example: 0xabc1...bcd
        type: string
      rollup_exit_root:
        description: Rollup exit root at this leaf
        example: 0x7890...123
        type: string
      timestamp:
        description: Timestamp of the block in seconds since the Unix epoch
        example: 1684500000
        type: integer
    type: object
  types.L2ContractsConfig:
    description: L2 smart contract addresses
    properties:
      BridgeAddr:
        description: BridgeAddr is the address of the bridge smart contract on L2
        example: 0xabcdef1234567890abcdef1234567890abcdef12
        type: string
      GlobalExitRootAddr:
        description: GlobalExitRootAddr is the address of the GER smart contract on
          L2
        example: 0xabcdef1234567890abcdef1234567890abcdef12
        type: string
    type: object
  types.L2GERSyncComponentConfig:
    description: Public configuration of the L2GERSync component, plus its detected
      sync mode
    properties:
      block_finality:
        description: BlockFinality is the block finality used by this syncer when
          querying the chain
        example: FinalizedBlock
        type: string
      initial_block:
        description: InitialBlock is the first block that was queried when starting
          the sync from scratch
        example: 12345
        type: integer
      sync_block_chunk_size:
        description: SyncBlockChunkSize is the amount of blocks queried per request
        example: 100
        type: integer
      sync_mode:
        description: |-
          SyncMode is the GER manager mode detected on L2 at startup: "Legacy" or "SovereignChain".
          Not configuration — auto-detected by probing the L2 GER contract — but useful operational
          information. Empty when this instance isn't running the L2GERSync component.
        example: SovereignChain
        type: string
    type: object
  types.L2GERSyncInfo:
    description: l2gersync (injected-GER) synchronization status
    properties:
      is_active:
        example: true
        type: boolean
      last_processed_block:
        example: 12345678
        type: integer
    type: object
  types.LegacyTokenMigrationResponse:
    description: Details of a legacy token migration event
    properties:
      amount:
        description: Amount of tokens migrated
        example: "1000000000000000000"
        type: string
      block_num:
        description: Block number where the migration occurred
        example: 1234
        type: integer
      block_pos:
        description: Position of the transaction in the block
        example: 1
        type: integer
      block_timestamp:
        description: Timestamp of the block
        example: 1684500000
        type: integer
      legacy_token_address:
        description: Legacy token address being migrated
        example: 0xdef456...
        type: string
      sender:
        description: Address of the sender initiating the migration
        example: 0xabc123...
        type: string
      tx_hash:
        description: Transaction hash of the migration event
        example: 0xabc123...
        type: string
      updated_token_address:
        description: New updated token address after migration
        example: 0xfeed789...
        type: string
    type: object
  types.LegacyTokenMigrationsResult:
    description: Paginated response of legacy token migrations
    properties:
      count:
        description: Total number of legacy token migration events
        example: 12
        type: integer
      legacy_token_migrations:
        description: List of legacy token migration events
        items:
          $ref: '#/definitions/types.LegacyTokenMigrationResponse'
        type: array
    type: object
  types.NetworkSyncInfo:
    description: Network-specific bridge sync status with deposit counts and block
      information
    properties:
      contract_deposit_count:
        example: 676797
        type: integer
      is_active:
        example: true
        type: boolean
      is_synced:
        example: true
        type: boolean
      last_processed_block:
        example: 12345678
        type: integer
      network_block:
        example: 12350000
        type: integer
      synchronized_deposit_count:
        example: 676797
        type: integer
    type: object
  types.PublicComponentsConfig:
    description: Public configuration of the syncer components backing the bridge
      service
    properties:
      BridgeL1Sync:
        $ref: '#/definitions/types.SyncComponentConfig'
      BridgeL2Sync:
        $ref: '#/definitions/types.SyncComponentConfig'
      L1InfoTreeSync:
        $ref: '#/definitions/types.SyncComponentConfig'
      L2GERSync:
        $ref: '#/definitions/types.L2GERSyncComponentConfig'
    type: object
  types.PublicConfigResponse:
    description: Public, non-sensitive configuration of the bridge service
    properties:
      components:
        allOf:
        - $ref: '#/definitions/types.PublicComponentsConfig'
        description: Components holds the public parameters of each syncer component
      config_sha1sum:
        description: |-
          ConfigSha1Sum is the SHA-1 checksum (hex-encoded) of this instance's fully-resolved
          configuration. Lets a caller (e.g. a proxy) detect when the running configuration differs
          from what it last saw, without comparing full (and potentially sensitive) config contents.
        example: 356a192b7913b04c54574d18c28d46e6395428ab
        type: string
      contracts:
        allOf:
        - $ref: '#/definitions/types.PublicContractsConfig'
        description: Contracts holds the smart contract addresses used by this instance,
          deduplicated by network
      network_id:
        description: |-
          NetworkID is the rollup/network ID this bridge service instance's bridge/claim syncers are
          listening on (the destination network for L2, mainnet=0 for L1).
        example: 10
        type: integer
    type: object
  types.PublicContractsConfig:
    description: Smart contract addresses used by this instance, split by network
    properties:
      L1:
        $ref: '#/definitions/types.L1ContractsConfig'
      L2:
        $ref: '#/definitions/types.L2ContractsConfig'
    type: object
  types.RemoveGEREventResponse:
    description: Information about a GER removal event
    properties:
      block_num:
        description: Block number where the GER was removed
        example: 1234
        type: integer
      block_pos:
        description: Position of the event within the block
        example: 0
        type: integer
      created_at:
        description: Timestamp when the remove event was recorded in database
        example: 1684500000
        type: integer
      global_exit_root:
        description: Global Exit Root hash that was removed
        example: 0x27ae5ba08d7291c96c8cbddcc148bf48a6d68c7974b94356f53754ef6171d757
        type: string
    type: object
  types.RemoveGEREventsResult:
    description: Paginated response of remove GER events
    properties:
      count:
        description: Total number of remove GER events
        example: 10
        type: integer
      remove_ger_events:
        description: List of remove GER events
        items:
          $ref: '#/definitions/types.RemoveGEREventResponse'
        type: array
    type: object
  types.RootByLERResponse:
    description: The deposit-count position of a local exit root in its network's
      local exit tree
    properties:
      block_num:
        description: BlockNum is the block in which the leaf that produced this root
          was added
        example: 123456
        type: integer
      block_position:
        description: BlockPosition orders same-block roots (multiple deposits in one
          block)
        example: 0
        type: integer
      index:
        description: Index is the deposit count at which this root became the local
          exit root (0-based)
        example: 42
        type: integer
    type: object
  types.SetClaimResponse:
    description: Detailed information about a set claim event
    properties:
      block_num:
        description: Block number where the set claim was processed
        example: 1234
        type: integer
      block_pos:
        description: Position of the set claim event within the block
        example: 2
        type: integer
      created_at:
        description: Timestamp when the set claim was created
        example: 1684500000
        type: integer
      global_index:
        description: Global index of the claim that was set
        example: "1000000000000000000"
        type: string
      tx_hash:
        description: Transaction hash associated with the set claim
        example: 0xdef4567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
        type: string
    type: object
  types.SetClaimsResult:
    description: Paginated response of set claim events (L2 networks only)
    properties:
      count:
        description: Total number of set claim events
        example: 20
        type: integer
      set_claims:
        description: List of set claim events
        items:
          $ref: '#/definitions/types.SetClaimResponse'
        type: array
    type: object
  types.SyncComponentConfig:
    description: Public configuration of a single syncer component
    properties:
      block_finality:
        description: BlockFinality is the block finality used by this syncer when
          querying the chain
        example: FinalizedBlock
        type: string
      initial_block:
        description: InitialBlock is the first block that was queried when starting
          the sync from scratch
        example: 12345
        type: integer
      sync_block_chunk_size:
        description: SyncBlockChunkSize is the amount of blocks queried per request
        example: 100
        type: integer
    type: object
  types.SyncStatus:
    description: Bridge sync status comparing on-chain deposit counts with local database
      counts
    properties:
      l1_info:
        $ref: '#/definitions/types.NetworkSyncInfo'
      l2_ger_info:
        $ref: '#/definitions/types.L2GERSyncInfo'
      l2_info:
        $ref: '#/definitions/types.NetworkSyncInfo'
    type: object
  types.TokenMappingResponse:
    description: Detailed information about a token mapping between origin and wrapped
      networks
    properties:
      block_num:
        description: Block number where the token mapping was recorded
        example: 123456
        type: integer
      block_pos:
        description: Position of the mapping event within the block
        example: 2
        type: integer
      block_timestamp:
        description: Timestamp of the block containing the mapping event
        example: 1684501234
        type: integer
      is_not_mintable:
        description: Indicates whether the wrapped token is not mintable (true = not
          mintable)
        example: false
        type: boolean
      metadata:
        description: Optional metadata associated with the token mapping
        example: "0xdeadbeef"
        type: string
      origin_network:
        description: ID of the origin network where the original token resides
        example: 1
        type: integer
      origin_token_address:
        description: Address of the token on the origin network
        example: 0x1234567890abcdef1234567890abcdef12345678
        type: string
      token_type:
        description: 'Type of the token mapping: 0 = WrappedToken, 1 = SovereignToken'
        example: 0
        type: integer
      tx_hash:
        description: Transaction hash associated with the mapping event
        example: 0xabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd
        type: string
      wrapped_token_address:
        description: Address of the wrapped token on the destination network
        example: 0xabcdef1234567890abcdef1234567890abcdef12
        type: string
    type: object
  types.TokenMappingsResult:
    description: Paginated response of token mapping records
    properties:
      count:
        description: Total number of token mapping records
        example: 27
        type: integer
      token_mappings:
        description: List of token mapping entries
        items:
          $ref: '#/definitions/types.TokenMappingResponse'
        type: array
    type: object
  types.UnsetClaimResponse:
    description: Detailed information about an unset claim event (UpdatedUnsetGlobalIndexHashChain)
    properties:
      block_num:
        description: Block number where the unset claim was processed
        example: 1234
        type: integer
      block_pos:
        description: Position of the unset claim event within the block
        example: 2
        type: integer
      created_at:
        description: Timestamp when the unset claim was created
        example: 1684500000
        type: integer
      global_index:
        description: Global index of the claim that was unset
        example: "1000000000000000000"
        type: string
      tx_hash:
        description: Transaction hash associated with the unset claim
        example: 0xdef4567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
        type: string
      unset_global_index_hash_chain:
        description: Hash chain value for unset global indexes
        example: "0x1234567890abcdef"
        type: string
    type: object
  types.UnsetClaimsResult:
    description: Paginated response of unset claim events (L2 networks only)
    properties:
      count:
        description: Total number of unset claim events
        example: 15
        type: integer
      unset_claims:
        description: List of unset claim events
        items:
          $ref: '#/definitions/types.UnsetClaimResponse'
        type: array
    type: object
info:
  contact:
    name: API Support
    url: https://polygon.technology/
  description: API documentation for the bridge service
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Bridge Service API
  version: "1.0"
paths:
  /:
    get:
      description: Returns the health status and version information of the bridge
        service
      produces:
      - application/json
      responses:
        "200":
          description: Health status and version information
          schema:
            $ref: '#/definitions/github_com_agglayer_aggkit_bridgeservice_types.HealthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get health status
      tags:
      - health
  /bridge-by-deposit-count:
    get:
      description: Returns the bridge by deposit count for the specified network (checks
        bridge and bridge_archive).
      parameters:
      - description: Network ID (0 for L1, L2 network ID otherwise)
        format: int32
        in: query
        name: network_id
        required: true
        type: integer
      - description: Deposit count
        format: int32
        in: query
        name: deposit_count
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.BridgeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get bridge by deposit count
      tags:
      - bridges
  /bridges:
    get:
      description: Returns a paginated list of bridge events for the specified network.
      parameters:
      - description: Origin network ID
        format: int32
        in: query
        name: network_id
        required: true
        type: integer
      - description: Page number (default 1)
        format: int32
        in: query
        name: page_number
        type: integer
      - description: Page size (default 100)
        format: int32
        in: query
        name: page_size
        type: integer
      - description: Filter by deposit count
        format: int64
        in: query
        name: deposit_count
        type: integer
      - description: Filter by from address
        in: query
        name: from_address
        type: string
      - collectionFormat: csv
        description: Filter by one or more destination network IDs (maximum 5 allowed)
        in: query
        items:
          format: int32
          type: integer
        name: network_ids
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.BridgesResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get bridges
      tags:
      - bridges
  /bridges-by-content:
    get:
      description: Returns all bridges (bridge and bridge_archive) matching the specified
        content for the given network.
      parameters:
      - description: Network ID (0 for L1, L2 network ID otherwise)
        format: int32
        in: query
        name: network_id
        required: true
        type: integer
      - description: Leaf type (0=asset, 1=message)
        format: int32
        in: query
        name: leaf_type
        required: true
        type: integer
      - description: Origin address (hex)
        in: query
        name: origin_address
        required: true
        type: string
      - description: Destination network ID
        format: int32
        in: query
        name: destination_network
        required: true
        type: integer
      - description: Destination address (hex)
        in: query
        name: destination_address
        required: true
        type: string
      - description: Amount (decimal string)
        in: query
        name: amount
        required: true
        type: string
      - description: Metadata (0x-prefixed hex, default empty)
        in: query
        name: metadata
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.BridgesByContentResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get bridges by content
      tags:
      - bridges
  /claim-candidates:
    get:
      description: |-
        Returns bridges originated on this network with deposit_count in
        (from_ler's index, to_ler's index] whose destination network is one of
        destination_network_ids. to_ler/from_ler define the deposit-count range only.
      parameters:
      - collectionFormat: csv
        description: Destination network IDs to filter by (maximum 5)
        in: query
        items:
          format: int32
          type: integer
        name: destination_network_ids
        required: true
        type: array
      - description: Local exit root, upper bound of the deposit-count range (0x-prefixed
          32-byte hex)
        in: query
        name: to_ler
        required: true
        type: string
      - description: Exclusive lower-bound local exit root; omitted means full history
        in: query
        name: from_ler
        type: string
      - description: Page number (default 1)
        format: int32
        in: query
        name: page_number
        type: integer
      - description: Page size (default 100)
        format: int32
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ClaimCandidatesResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found - to_ler or from_ler not synced yet
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get claim candidates
      tags:
      - bridges
  /claim-proof:
    get:
      description: |-
        Returns the Merkle proofs (local and rollup exit root) and
        the corresponding L1 info tree leaf needed to verify a claim.
      parameters:
      - description: Origin network ID
        format: int32
        in: query
        name: network_id
        required: true
        type: integer
      - description: Index in the L1 info tree
        format: int32
        in: query
        name: leaf_index
        required: true
        type: integer
      - description: Number of deposits in the bridge
        format: int32
        in: query
        name: deposit_count
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Merkle proofs and L1 info tree leaf
          schema:
            $ref: '#/definitions/github_com_agglayer_aggkit_bridgeservice_types.ClaimProof'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found - not indexed by the syncers yet, retry later
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable - syncer not available or resolving a reorg
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get claim proof
      tags:
      - claims
  /claims:
    get:
      description: Returns a paginated list of claims for the specified network.
      parameters:
      - description: Origin network ID
        format: int32
        in: query
        name: network_id
        required: true
        type: integer
      - description: Page number (default 1)
        format: int32
        in: query
        name: page_number
        type: integer
      - description: Page size (default 100)
        format: int32
        in: query
        name: page_size
        type: integer
      - collectionFormat: csv
        description: Filter by one or more source network IDs (maximum 5 allowed)
        in: query
        items:
          format: int32
          type: integer
        name: network_ids
        type: array
      - description: Whether to include full response fields (default false)
        in: query
        name: include_all_fields
        type: boolean
      - description: Filter by global index
        format: int32
        in: query
        name: global_index
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ClaimsResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get claims
      tags:
      - claims
  /claims-by-ger:
    get:
      description: Returns all claims (DetailedClaimEvent type) recorded with the
        specified GER for the given network.
      parameters:
      - description: Network ID (0 for L1, L2 network ID otherwise)
        format: int32
        in: query
        name: network_id
        required: true
        type: integer
      - description: Global exit root (0x-prefixed 32-byte hex)
        in: query
        name: global_exit_root
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ClaimsByGERResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get claims by global exit root
      tags:
      - claims
  /config:
    get:
      description: |-
        Returns a sanitized view of the bridge service configuration: component sync
        parameters and contract addresses, deduplicated by network. Never exposes RPC
        URLs, DB paths, private keys or any other internal/sensitive configuration value.
      produces:
      - application/json
      responses:
        "200":
          description: Public bridge service configuration
          schema:
            $ref: '#/definitions/types.PublicConfigResponse'
      summary: Get public configuration
      tags:
      - config
  /injected-l1-info-leaf:
    get:
      description: |-
        Returns the L1 info tree leaf either at the given index (for L1)
        or the first injected global exit root after the given index (for L2). For L2,
        injected_l2_block_num/injected_l2_block_timestamp additionally carry the destination
        network's own block, and when, the Global Exit Root got injected.
      parameters:
      - description: Network ID
        in: query
        name: network_id
        required: true
        type: integer
      - description: L1 Info Tree Index
        in: query
        name: leaf_index
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.L1InfoTreeLeafResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found - global exit root not injected or leaf not indexed
            yet
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable - a syncer is resolving a reorg, retry
            later
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get injected L1 info tree leaf after a given L1 info tree index
      tags:
      - l1-info-tree-leaf
  /l1-info-tree-index:
    get:
      description: Returns the first L1 Info Tree index after a given deposit count
        for the specified network
      parameters:
      - description: Network ID
        in: query
        name: network_id
        required: true
        type: integer
      - description: Deposit count
        in: query
        name: deposit_count
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            format: int32
            type: integer
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found - not indexed by the syncers yet, retry later
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable - a syncer is resolving a reorg, retry
            later
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get L1 Info Tree index for a bridge
      tags:
      - l1-info-tree-leaf
  /l1-info-tree-leaf-by-ger:
    get:
      description: |-
        Returns the L1 info tree leaf (index, exit roots, block info) for the given
        Global Exit Root. The L1 info tree only exists on L1, so network_id must be 0.
      parameters:
      - description: Network ID (must be 0, mainnet)
        in: query
        name: network_id
        required: true
        type: integer
      - description: Global Exit Root
        in: query
        name: global_exit_root
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.L1InfoTreeLeafResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found - GER not part of the L1 info tree (yet)
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get L1 info tree leaf by Global Exit Root
      tags:
      - l1-info-tree-leaf
  /last-reorg-event:
    get:
      description: Retrieves the last known reorg event for either L1 or L2, based
        on the provided network ID.
      parameters:
      - description: Network ID (e.g., 0 for L1, or the ID of the L2 network)
        in: query
        name: network_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Details of the last reorg event
          schema:
            $ref: '#/definitions/bridgesync.LastReorg'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get last reorg event
      tags:
      - reorgs
  /legacy-token-migrations:
    get:
      description: Returns legacy token migrations for the given network, paginated
      parameters:
      - description: Network ID
        in: query
        name: network_id
        required: true
        type: integer
      - description: Page number
        in: query
        name: page_number
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LegacyTokenMigrationsResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get legacy token migrations
      tags:
      - legacy-token-migrations
  /removed-gers:
    get:
      description: Returns a list of remove GER events, optionally filtered by specific
        GER.
      parameters:
      - description: Filter by specific Global Exit Root hash
        in: query
        name: global_exit_root
        type: string
      - description: 'Maximum number of events to return (default: 50)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of remove GER events
          schema:
            $ref: '#/definitions/types.RemoveGEREventsResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get remove GER events
      tags:
      - ger-events
  /root-by-ler:
    get:
      description: |-
        Resolves ler to the position (deposit-count index) it had in network_id's local
        exit tree when it was computed.
      parameters:
      - description: Network ID (0 for L1, L2 network ID otherwise)
        in: query
        name: network_id
        required: true
        type: integer
      - description: Local exit root (0x-prefixed 32-byte hex)
        in: query
        name: ler
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.RootByLERResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found - ler not synced yet
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get the deposit-count index of a local exit root
      tags:
      - bridges
  /set-claims:
    get:
      description: Returns set claims for the configured L2 network, paginated.
      parameters:
      - description: Page number
        in: query
        name: page_number
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by global index
        in: query
        name: global_index
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.SetClaimsResult'
        "400":
          description: Bad Request - Invalid parameters
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable - L2 bridge syncer not available
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get set claims
      tags:
      - set-claims
  /sync-status:
    get:
      description: |-
        Returns bridge sync status by comparing on-chain bridge deposit counts with local database counts.
        Shows if bridge syncers are active and whether they're keeping up with on-chain events.
        Also reports the l2gersync (injected-GER) sync status when available.
      produces:
      - application/json
      responses:
        "200":
          description: Bridge synchronization status for L1 and L2 networks
          schema:
            $ref: '#/definitions/types.SyncStatus'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get bridge synchronization status
      tags:
      - sync
  /token-mappings:
    get:
      description: Returns token mappings for the given network, paginated
      parameters:
      - description: Network ID
        in: query
        name: network_id
        required: true
        type: integer
      - description: Page number
        in: query
        name: page_number
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by origin token address
        in: query
        name: origin_token_address
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.TokenMappingsResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get token mappings
      tags:
      - token-mappings
  /unset-claims:
    get:
      description: Returns unset claims for the configured L2 network, paginated.
      parameters:
      - description: Page number
        in: query
        name: page_number
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by global index
        in: query
        name: global_index
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.UnsetClaimsResult'
        "400":
          description: Bad Request - Invalid parameters
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "503":
          description: Service Unavailable - L2 bridge syncer not available
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get unset claims
      tags:
      - unset-claims
swagger: "2.0"
