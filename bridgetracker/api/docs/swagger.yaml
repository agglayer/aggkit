basePath: /tracker/v1
definitions:
  api.ActivityItem:
    properties:
      bridge:
        allOf:
        - $ref: '#/definitions/types.BridgeResponse'
        description: |-
          Bridge is the raw bridge event, exactly as returned by the origin network's bridge
          service, unmodified
      bridge_network_id:
        description: BridgeNetworkID is the network whose bridge service reported
          Bridge (its origin network)
        type: integer
      claim:
        allOf:
        - $ref: '#/definitions/types.ClaimResponse'
        description: |-
          Claim is the raw claim record, exactly as returned by the destination network's bridge
          service, unmodified, once Claimed is true and the indexer has recorded it
      claim_network_id:
        description: |-
          ClaimNetworkID is the network whose bridge service reported Claim (the bridge's
          destination network); only present alongside Claim
        type: integer
      claimed:
        description: |-
          Claimed is the tri-state result of the destination bridge contract's isClaimed() call
          the last time it was checked: "false" (confirmed unclaimed), "true" (claimed), or
          "error" if the check itself failed (e.g. no bridge contract address configured for the
          destination network) — callers must not read "error" as "false"
        type: string
      errors:
        additionalProperties:
          type: string
        description: |-
          Errors holds the message of whatever check failed the last time this item was refreshed,
          keyed by which check it was — currently only "claim", present when Claimed is "error"
        type: object
      tracking:
        allOf:
        - $ref: '#/definitions/api.TrackingData'
        description: |-
          Tracking is the bridge tracker's current status for this bridge; only present when the
          request set includeTracking=true and the bridge is still unclaimed
    type: object
  api.ActivityResponse:
    properties:
      bridges:
        description: Bridges holds every bridge found for FromAddress across every
          configured bridge service
        items:
          $ref: '#/definitions/api.ActivityItem'
        type: array
      from_address:
        description: FromAddress is the address requested
        items:
          type: integer
        type: array
    type: object
  api.BridgeEventData:
    properties:
      amount:
        description: |-
          Amount is the amount of the asset being bridged, as a decimal string — a plain JSON
          number would risk losing precision on wei-scale amounts in clients that decode numbers
          as float64 (e.g. JavaScript)
        type: string
      deposit_count:
        description: DepositCount is the index of the bridge leaf in the origin exit
          tree
        type: integer
      destination_address:
        description: DestinationAddress is the address that receives the asset on
          the destination network
        items:
          type: integer
        type: array
      destination_network:
        description: DestinationNetwork is the network the bridge exits to (0 -> Mainnet)
        type: integer
      leaf_type:
        description: LeafType is the string representation of the kind of leaf the
          bridge created (asset or message)
        type: string
      origin_address:
        description: OriginAddress is the address of the asset on the origin network
        items:
          type: integer
        type: array
      origin_network:
        description: OriginNetwork is the network where the bridged asset originates
          from
        type: integer
    type: object
  api.BridgeStatus:
    properties:
      block_number:
        description: BlockNumber is the block, on the origin network, where the BridgeEvent
          was emitted
        type: integer
      block_timestamp:
        description: BlockTimestamp is the timestamp of the block, on the origin network,
          where the BridgeEvent was emitted
        type: integer
      bridge_type:
        description: BridgeType is the string representation of the bridge's direction
          (e.g. "L1->L2")
        type: string
      event:
        allOf:
        - $ref: '#/definitions/api.BridgeEventData'
        description: Event holds the facts unpacked directly from the on-chain BridgeEvent
          log
      log_index:
        description: LogIndex is the position of the BridgeEvent log within BlockNumber
        type: integer
    type: object
  api.BridgeStepPath:
    properties:
      end_date:
        type: string
      error:
        allOf:
        - $ref: '#/definitions/types.ErrorStep'
        description: Error carries the error details when Status is types.StepStatusError,
          nil otherwise
      expected_duration:
        $ref: '#/definitions/github_com_agglayer_aggkit_bridgetracker_types.Duration'
      result:
        description: |-
          Result is the data the step has produced so far; its shape depends on Step:
          *types.GERUpdateResult (StepWaitingGERUpdate), *types.InjectedGERResult
          (StepWaitingGERInjection), *types.LERUpdateResult (StepWaitingLERUpdate),
          *types.PendingInclusionResult (StepPendingInclusion), *types.CertificateData
          (StepCertificatePending), *types.L1SettledGERResult (StepWaitL1SettledGER) or
          *types.ClaimResult (StepWaitingClaim). nil until
          the step produces one, and for steps that never do. Most steps only set this once Done,
          but StepCertificatePending (Status still InProgress) may already carry the certificate's
          current, not yet settled, status — see domain.ErrCertificateNotSettled
      start_date:
        type: string
      status:
        description: Status is the string representation of the step's status (e.g.
          "done")
        type: string
      step_index:
        description: StepIndex is this step's position within the parent TrackingData.AllSteps
          list
        type: integer
      step_name:
        description: StepName is the string representation of the bridge step (e.g.
          "PendingInclusion")
        type: string
    type: object
  api.TrackingData:
    properties:
      all_steps:
        description: |-
          AllSteps holds all expected steps of the bridge's route; GER/LER, certificate and
          claim data are reported per step in each entry's Result. nil while BridgeStatus is nil
        items:
          $ref: '#/definitions/api.BridgeStepPath'
        type: array
      bridge_status:
        allOf:
        - $ref: '#/definitions/api.BridgeStatus'
        description: |-
          BridgeStatus is nil until the tracker resolves the bridge; from then on it carries
          the full BridgeStatus. Marshaled explicitly as null while unresolved (no omitempty)
          so clients can poll on its presence without an extra field to check
      error:
        allOf:
        - $ref: '#/definitions/types.ErrorStep'
        description: |-
          Error mirrors whatever currently explains the bridge not progressing, if anything: a
          terminal give-up to even resolve it (e.g. the tx does not exist on the network or is
          not a bridge transaction — TrackingStatus is Error and BridgeStatus/StepIndex/AllSteps
          stay nil forever), a transient FindBridge failure still being retried (TrackingStatus
          is unaffected), or the same error already nested in AllSteps[StepIndex].Error once the
          bridge is otherwise resolved. nil while nothing has failed
      network_id:
        description: NetworkID is the network of the request (0 -> Mainnet)
        type: integer
      step_index:
        description: |-
          StepIndex is the index into AllSteps of the step that explains TrackingStatus: the
          step currently in progress when Running, the step in error when Error, or the last
          step (Claimed) when Finished. nil while BridgeStatus/AllSteps are nil
        type: integer
      tracking_status:
        description: TrackingStatus is the string representation of the bridge's lifecycle
          status
        type: string
      tx_hash:
        description: TxHash is the transaction hash of the request
        items:
          type: integer
        type: array
    type: object
  github_com_agglayer_aggkit_bridgetracker_types.Duration:
    properties:
      time.Duration:
        enum:
        - -9223372036854775808
        - 9223372036854775807
        - 1
        - 1000
        - 1000000
        - 1000000000
        - 60000000000
