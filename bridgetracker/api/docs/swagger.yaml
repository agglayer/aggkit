  types.BridgeResponse:
    description: Detailed information about a bridge event
    properties:
      amount:
        description: Amount of tokens being bridged
        example: "1000000000000000000"
        type: string
      block_num:
        description: Block number where the bridge event was recorded
        example: 1234
        type: integer
      block_pos:
        description: Position of the bridge event within the block
        example: 1
        type: integer
      block_timestamp:
        description: Timestamp of the block containing the bridge event
        example: 1684500000
        type: integer
      bridge_hash:
        description: Unique hash representing the bridge event, often used as an identifier
        example: 0xabc1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcd
        type: string
      deposit_count:
        description: Count of total deposits processed so far for the given token/address
        example: 10
        type: integer
      destination_address:
        description: Address of the token receiver on the destination network
        example: 0xdef4567890abcdef1234567890abcdef12345678
        type: string
      destination_network:
        description: ID of the network where the bridge transaction is destined
        example: 42161
        type: integer
      from_address:
        description: |-
          Address that initiated the transaction on bridge contract. It can be intermediary contract or EOA.
          May be null if bridge was synced with SyncFromInBridges=false
        example: 0xabc1234567890abcdef1234567890abcdef1234
        type: string
      global_index:
        description: Global index of the bridge event (consisted of mainnet flag,
          rollup id and deposit count)
        example: "4294967296"
        type: string
      leaf_type:
        description: Type of leaf (bridge event type) used in the tree structure
        example: 1
        type: integer
      metadata:
        description: Optional metadata attached to the bridge event
        example: "0xdeadbeef"
        type: string
      origin_address:
        description: Address of the token sender on the origin network
        example: 0xabc1234567890abcdef1234567890abcdef1234
        type: string
      origin_network:
        description: ID of the network where the bridge transaction originated
        example: 10
        type: integer
      to_address:
        description: Address of the contract that was the recipient of the transaction.
          This may differ from the bridge contract address.
        example: 0xF9D64d54D32EE2BDceAAbFA60C4C438E224427d0
        type: string
      tx_hash:
        description: Hash of the transaction that included the bridge event
        example: 0xdef4567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
        type: string
      txn_sender:
        description: Address of the transaction sender who initiated the bridge transaction
        example: 0xabc1234567890abcdef1234567890abcdef12345
        type: string
    type: object
  types.ClaimResponse:
    description: Detailed information about a claim event
    properties:
      amount:
        description: Amount claimed
        example: "1000000000000000000"
        type: string
      block_num:
        description: Block number where the claim was processed
        example: 1234
        type: integer
      block_timestamp:
        description: Timestamp of the block containing the claim
        example: 1684500000
        type: integer
      destination_address:
        description: Address receiving the claim on the destination network
        example: 0xdef4567890abcdef1234567890abcdef12345678
        type: string
      destination_network:
        description: Destination network ID where the claim was processed
        example: 42161
        type: integer
      from_address:
        description: Address from which the claim originated
        example: 0xabc1234567890abcdef1234567890abcdef1234
        type: string
      global_exit_root:
        description: Global exit root associated with the claim
        example: 0x27ae5ba08d7291c96c8cbddcc148bf48a6d68c7974b94356f53754ef6171d757
        type: string
      global_index:
        description: Global index of the claim
        example: "1000000000000000000"
        type: string
      is_message:
        description: IsMessage indicates whether this is a message claim (leaf type
          1) rather than an asset claim (leaf type 0)
        example: false
        type: boolean
      mainnet_exit_root:
        description: Mainnet exit root associated with the claim
        example: 0x27ae5ba08d7291c96c8cbddcc148bf48a6d68c7974b94356f53754ef6171d757
        type: string
      metadata:
        description: Metadata associated with the claim
        example: "0xdeadbeef"
        type: string
      origin_address:
        description: Address initiating the claim on the origin network
        example: 0xabc1234567890abcdef1234567890abcdef1234
        type: string
      origin_network:
        description: Origin network ID where the claim was initiated
        example: 10
        type: integer
      proof_local_exit_root:
        description: Proof local exit root associated with the claim (optional)
        example:
        - '[0x1'
        - ' 0x2'
        - ' 0x3...]'
        items:
          type: string
        type: array
      proof_rollup_exit_root:
        description: Proof rollup exit root associated with the claim (optional)
        example:
        - '[0x4'
        - ' 0x5'
        - ' 0x6...]'
        items:
          type: string
        type: array
      rollup_exit_root:
        description: Rollup exit root associated with the claim
        example: 0x27ae5ba08d7291c96c8cbddcc148bf48a6d68c7974b94356f53754ef6171d757
        type: string
      tx_hash:
        description: Transaction hash associated with the claim
        example: 0xdef4567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
        type: string
    type: object
  types.ErrorData:
    properties:
      code:
        description: Code is an HTTP-like error code (e.g. 400 invalid params, 404
          bridge tx not found)
        type: integer
      message:
        description: Message is a human-readable description of the error
        type: string
    type: object
  types.ErrorStep:
    properties:
      description:
        description: Description holds the human-readable description of the error;
          one entry per occurrence
        items:
          type: string
        type: array
      error_type:
        $ref: '#/definitions/types.StepErrorType'
      error_type_string:
        description: ErrorTypeString is the string representation of ErrorType, auto-populated
          on JSON marshaling
        type: string
      retry_count:
        description: RetryCount is the number of retries attempted so far for this
          step
        type: integer
    type: object
  types.HealthResponse:
    properties:
      config_sha1:
        description: |-
          ConfigSHA1 is the sha1sum (hex) of the configuration the instance was started with;
          it allows checking that all instances behind a proxy run the same configuration
        type: string
      instance_id:
        description: |-
          InstanceID is a UUID generated at startup; it changes on every execution, so two
          responses with different InstanceID come from different instances (or the same
          instance after a restart)
        type: string
      status:
        description: Status is always "ok"
        type: string
      version:
        allOf:
        - $ref: '#/definitions/types.VersionInfo'
        description: Version is the build/version information of the running instance
    type: object
  types.StepErrorType:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - StepErrorTransient
    - StepErrorPermanent
    - StepErrorExhausted
  types.VersionInfo:
    properties:
      arch:
        description: Arch is the target architecture (e.g. "amd64")
        type: string
      build_date:
        description: BuildDate is the build timestamp
        type: string
      git_branch:
        description: GitBranch is the git branch the binary was built from
        type: string
      git_rev:
        description: GitRev is the git revision the binary was built from
        type: string
      go_version:
        description: GoVersion is the Go runtime version (e.g. "go1.24.0")
        type: string
      os:
        description: OS is the target operating system (e.g. "linux")
        type: string
      version:
        description: Version is the semantic version (e.g. "v0.1.0")
        type: string
    type: object
info:
  contact:
    name: API Support
    url: https://polygon.technology/
  description: API documentation for the bridge tracker service
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Bridge Tracker API
  version: "1.0"
paths:
  /activity/from/{from_address}:
    get:
      description: |-
        Scans every bridge service the tracker knows about for bridges sent by
        from_address and reports each one's claim state, exactly as the bridge service
        reported it. Results are cached: a bridge already known to be claimed, with its
        claim record already fetched, is not rechecked on a later call. Passing
        includeTracking=true additionally registers every still-unclaimed bridge with
        the bridge tracker and includes its current tracking snapshot. filterBridges
        restricts the result to bridges with only that claim state (claimed / still
        pending / errored while checking).
      parameters:
      - description: Address that sent the bridges to look up
        in: path
        name: from_address
        required: true
        type: string
      - description: Register still-unclaimed bridges with the tracker
        in: query
        name: includeTracking
        type: boolean
      - default: all
        description: Which bridges to return
        enum:
        - all
        - claimed
        - pending
        - error
        in: query
        name: filterBridges
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ActivityResponse'
        "400":
          description: Invalid from_address or filterBridges
          schema:
            $ref: '#/definitions/types.ErrorData'
        "500":
          description: Scanning the configured bridge services failed
          schema:
            $ref: '#/definitions/types.ErrorData'
      summary: Get bridge activity by sender address
      tags:
      - bridge-tracker
  /health:
    get:
      description: |-
        Returns the health status, instance identity and build information of the
        running instance. Useful as liveness/readiness probe and to check which
        build/configuration runs on each instance behind the proxy
      produces:
      - application/json
      responses:
        "200":
          description: Health status and version information
          schema:
            $ref: '#/definitions/types.HealthResponse'
      summary: Health check
      tags:
      - bridge-tracker
  /network/{network_id}/tx/{tx_hash}:
    get:
      description: |-
        Returns the current step of the bridge and the full path it is expected to
        follow. Calling this endpoint adds the bridge to the list of supervised
        bridges. The response is always a TrackingData: its bridge_status field is
        null until the tracker resolves the bridge, so the client keeps polling (or
        subscribes over the WebSocket) until it is populated
      parameters:
      - description: Network where the bridge transaction was sent (0 -> Mainnet)
        format: int32
        in: path
        name: network_id
        required: true
        type: integer
      - description: Hash of the transaction that created the bridge (bridgeAsset
          or bridgeMessage)
        in: path
        name: tx_hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bridge registered; bridge_status/error fill in once resolved
          schema:
            $ref: '#/definitions/api.TrackingData'
        "400":
          description: Invalid transaction hash or network id
          schema:
            $ref: '#/definitions/types.ErrorData'
        "503":
          description: Supervised registry is at capacity
          schema:
            $ref: '#/definitions/types.ErrorData'
      summary: Get bridge status by transaction hash
      tags:
      - bridge-tracker
  /network/{network_id}/tx/{tx_hash}/ws:
    get:
      description: |-
        Upgrades the request to a WebSocket connection that receives the bridge
        status as it changes, instead of polling the REST endpoint. Connecting adds
        the bridge to the list of supervised bridges
      parameters:
      - description: Network where the bridge transaction was sent (0 -> Mainnet)
        format: int32
        in: path
        name: network_id
        required: true
        type: integer
      - description: Hash of the transaction that created the bridge (bridgeAsset
          or bridgeMessage)
        in: path
        name: tx_hash
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
      summary: Subscribe to bridge status updates by transaction hash
      tags:
      - bridge-tracker
swagger: "2.0"
