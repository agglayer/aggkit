# https://github.com/orgs/agglayer/discussions/213

[rate-limiting]
send-tx = "unlimited"
# [rate-limiting.send-tx]
# max-per-interval = 1
# time-interval = "15m"

[rate-limiting.network]

# Bookkeeping-only from v0.6.0-rc.2 onward: per-epoch certificate rate
# limiting was deleted in commit 41d7a17e (PR #1615). epoch-duration still
# parses and drives epoch bookkeeping/storage indexing, but it moves neither
# settlement nor submission timing under trigger_cert_mode: ASAP (this
# package's default) -- do not treat it as a latency knob.
[epoch.block-clock]
epoch-duration = 15
genesis-block = 60

[shutdown]
runtime-timeout = 5

[certificate-orchestrator]
input-backpressure-buffer-size = 1000

[certificate-orchestrator.prover.sp1-local]

[storage]
db-path = "/etc/agglayer/storage"

[storage.backup]
path = "/etc/agglayer/backups"
state-max-backup-count = 100
pending-max-backup-count = 100
