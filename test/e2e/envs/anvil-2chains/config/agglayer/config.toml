# [outbound.rpc.settle] used to live here. It has had no effect on settlement
# since agglayer PR #1393 introduced the agglayer-settlement-service --
# OutboundConfig is explicitly documented upstream as deprecated, and at
# v0.6.0-rc.7+ the binary itself warns on startup if this section is present
# (OutboundConfig::ignored_config_warning()). The real settlement-tx knobs
# live under [settlement.pessimistic-proof-tx-config] below.
[settlement.pessimistic-proof-tx-config]
# Number of L1 block confirmations required before a settlement tx's receipt
# is considered resolved. Upstream default is 12 (default_confirmations(),
# crates/agglayer-config/src/settlement_service.rs); this devnet had
# effectively been stuck at that default the whole time the dead
# [outbound.rpc.settle] confirmations=1 above was silently ignored. Lower
# values settle certificates faster at the cost of reorg safety -- fine on a
# throwaway anvil L1, not a production recommendation.
confirmations = 1
# Finality level required for a settlement tx to be considered settled.
# Upstream enum is LatestBlock/SafeBlock/FinalizedBlock (SafeBlock is the
# upstream default); the latest->safe->finalized lag on an anvil L1 is
# l1_anvil_block_time * l1_anvil_slots_in_epoch seconds per step. The
# agglayer_settlement_policy input arg uses the lowercase
# latest/safe/finalized tokens; they're translated to the upstream wire
# enum names here since agglayer's SettlementPolicy has no
# #[serde(rename_all = "kebab-case")] (confirmed against
# crates/agglayer-config/tests/fixtures/settlement/*.toml at v0.6.0-rc.8,
# which all use the PascalCase variant names verbatim).
settlement-policy = "SafeBlock"
# retry-on-transient-failure and gas-limit-multiplier-factor are
# intentionally left unset here (upstream defaults apply): the old
# [outbound.rpc.settle] max-retries/retry-interval had no 1:1 mapping onto
# the new schema's two separate retry-policy tables, and settlement-timeout
# = 1200 has no equivalent anywhere in the new schema at all (grepped
# SettlementTransactionConfig/SettlementServiceConfig at v0.6.0-rc.8 -- no
# timeout field exists upstream; that intent has no home).
#
# A3 measurement (plans/snapshot-v2-aggkit-e2e/A3-evidence/): the first
# receipt check for a settlement tx fires immediately after broadcast (0
# confirmations elapsed yet), returns NotIncludedYet, and upstream's default
# retry-on-not-included-on-l1.initial-interval (1m, unset here previously)
# gates the *next* attempt -- confirmed via the agglayer container log
# ("Transient error while executing retryable callback, error:
# NotIncludedYet, retry_attempt: 1, sleep_duration: 61.936s") on this exact
# env. Lowered here since the anvil L1 reaches 1 confirmation within ~1s.
[settlement.pessimistic-proof-tx-config.retry-on-not-included-on-l1]
initial-interval = "5s"

