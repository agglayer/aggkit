# Ethereum L1 Snapshot Environment
# Enclave: cdk-erigon
# Tag: cdk-erigon-20260529-225403
# Genesis: 0xf5583157f40aa01faf85f01632768bc98062f55ef3a88ccee3f647d206ba379c

services:
  geth:
    image: snapshot-geth:cdk-erigon-20260529-225403
    container_name: cdk-erigon-20260529-225318-geth
    hostname: geth
    # Alias the restored L1 EL under its original kurtosis service name so
    # components that hardcode the kurtosis L1 RPC hostname keep resolving it.
    # cdk-erigon's captured config.yaml references zkevm.l1-rpc-url as
    # http://el-1-geth-lighthouse:8545; op-stack instead has its L1 hostnames
    # rewritten to "geth" during adaptation. The alias is harmless for op-stack.
    networks:
      default:
        aliases:
          - el-1-geth-lighthouse
    command:
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.vhosts=*"
      - "--http.corsdomain=*"
      - "--http.api=admin,engine,net,eth,web3,debug,txpool"
      - "--ws"
      - "--ws.addr=0.0.0.0"
      - "--ws.port=8546"
      - "--ws.origins=*"
      - "--ws.api=admin,engine,net,eth,web3,debug,txpool"
      - "--authrpc.addr=0.0.0.0"
      - "--authrpc.port=8551"
      - "--authrpc.vhosts=*"
      - "--authrpc.jwtsecret=/jwt/jwtsecret"
      - "--datadir=/data/geth/execution-data"
      - "--port=30303"
      - "--discovery.port=30303"
      - "--syncmode=full"
      - "--gcmode=archive"
      - "--networkid=271828"
      - "--metrics"
      - "--metrics.addr=0.0.0.0"
      - "--metrics.port=9001"
      - "--allow-insecure-unlock"
      - "--nodiscover"
    ports:
      - "8545:8545"    # HTTP RPC
      - "8546:8546"    # WebSocket RPC
      - "8551:8551"    # Engine API
      - "30303:30303"  # P2P TCP
      - "30303:30303/udp"  # P2P UDP
      - "9001:9001"    # Metrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 10s

  beacon:
    image: snapshot-beacon:cdk-erigon-20260529-225403
    container_name: cdk-erigon-20260529-225318-beacon
    hostname: beacon
    # Note: command is handled by beacon-entrypoint.sh which patches genesis time and starts Teku
    ports:
      - "4000:4000"    # Beacon API
      - "9000:9000"    # P2P TCP
      - "9000:9000/udp"  # P2P UDP
      - "5054:5054"    # Metrics
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/eth/v1/node/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 30s

  validator:
    image: snapshot-validator:cdk-erigon-20260529-225403
    container_name: cdk-erigon-20260529-225318-validator
    hostname: validator
    # Command is handled by validator-entrypoint.sh which gates startup on beacon sync
    depends_on:
      beacon:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "validator-client"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  agglayer:
    image: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/public/agglayer:0.4.4-remove-agglayer-prover
    container_name: cdk-erigon-20260529-225318-agglayer
    hostname: agglayer
    entrypoint: ["/usr/local/bin/agglayer"]
    command:
      - "run"
      - "--cfg"
      - "/etc/agglayer/config.toml"
    volumes:
      - ./config/agglayer/config.toml:/etc/agglayer/config.toml:ro
      - ./config/agglayer/aggregator.keystore:/etc/agglayer/aggregator.keystore:ro
    ports:
      - "4443:4443"    # gRPC RPC
      - "4444:4444"    # Read RPC
      - "4446:4446"    # Admin API
      - "9092:9092"    # Prometheus metrics
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /proc/1/cmdline"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - RUST_BACKTRACE=1

  cdk-erigon-001:
    image: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/public/cdk-erigon:v2.65.0-RC1
    container_name: cdk-erigon-20260529-225318-cdk-erigon-001
    hostname: cdk-erigon-001
    # Alias the restored EL under the kurtosis RPC service name as well, since
    # the captured aggkit config dials the L2 over http://cdk-erigon-rpc-<prefix>:8545.
    # In the snapshot the single restored erigon node serves both roles.
    networks:
      default:
        aliases:
          - cdk-erigon-rpc-001
    user: "0:0"
    environment:
      - CDK_ERIGON_SEQUENCER=1
    entrypoint: ["cdk-erigon"]
    command: ["--config", "/etc/cdk-erigon/config.yaml"]
    volumes:
      - ./config/001/cdk-erigon/etc:/etc/cdk-erigon:ro
      - cdk-erigon-data-001:/home/erigon/data
    ports:
      - "11545:8545"    # HTTP RPC
      - "11546:8546"    # WebSocket RPC
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 180s

  aggkit-001:
    image: aggkit:local
    container_name: cdk-erigon-20260529-225318-aggkit-001
    hostname: aggkit-001
    entrypoint: ["/usr/local/bin/aggkit"]
    command:
      - "run"
      - "--cfg=/etc/aggkit/config.toml"
      - "--components=aggsender,bridge"
    volumes:
      - ./config/001/aggkit-config.toml:/etc/aggkit/config.toml:ro
      - ./config/001/sequencer.keystore:/etc/aggkit/sequencer.keystore:ro
      - ./config/001/aggoracle.keystore:/etc/aggkit/aggoracle.keystore:ro
      - ./config/001/sovereignadmin.keystore:/etc/aggkit/sovereignadmin.keystore:ro
    ports:
      - "11576:5576"    # RPC
      - "11577:5577"    # REST API
    depends_on:
      geth:
        condition: service_healthy
      cdk-erigon-001:
        condition: service_healthy
      agglayer:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - RUST_BACKTRACE=1

  cdk-erigon-002:
    image: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/public/cdk-erigon:v2.65.0-RC1
    container_name: cdk-erigon-20260529-225318-cdk-erigon-002
    hostname: cdk-erigon-002
    # Alias the restored EL under the kurtosis RPC service name as well, since
    # the captured aggkit config dials the L2 over http://cdk-erigon-rpc-<prefix>:8545.
    # In the snapshot the single restored erigon node serves both roles.
    networks:
      default:
        aliases:
          - cdk-erigon-rpc-002
    user: "0:0"
    environment:
      - CDK_ERIGON_SEQUENCER=1
    entrypoint: ["cdk-erigon"]
    command: ["--config", "/etc/cdk-erigon/config.yaml"]
    volumes:
      - ./config/002/cdk-erigon/etc:/etc/cdk-erigon:ro
      - cdk-erigon-data-002:/home/erigon/data
    ports:
      - "12545:8545"    # HTTP RPC
      - "12546:8546"    # WebSocket RPC
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 180s

  aggkit-002:
    image: aggkit:local
    container_name: cdk-erigon-20260529-225318-aggkit-002
    hostname: aggkit-002
    entrypoint: ["/usr/local/bin/aggkit"]
    command:
      - "run"
      - "--cfg=/etc/aggkit/config.toml"
      - "--components=aggsender,bridge"
    volumes:
      - ./config/002/aggkit-config.toml:/etc/aggkit/config.toml:ro
      - ./config/002/sequencer.keystore:/etc/aggkit/sequencer.keystore:ro
      - ./config/002/aggoracle.keystore:/etc/aggkit/aggoracle.keystore:ro
      - ./config/002/sovereignadmin.keystore:/etc/aggkit/sovereignadmin.keystore:ro
    ports:
      - "12576:5576"    # RPC
      - "12577:5577"    # REST API
    depends_on:
      geth:
        condition: service_healthy
      cdk-erigon-002:
        condition: service_healthy
      agglayer:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - RUST_BACKTRACE=1

  cdk-erigon-003:
    image: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/public/cdk-erigon:v2.65.0-RC1
    container_name: cdk-erigon-20260529-225318-cdk-erigon-003
    hostname: cdk-erigon-003
    # Alias the restored EL under the kurtosis RPC service name as well, since
    # the captured aggkit config dials the L2 over http://cdk-erigon-rpc-<prefix>:8545.
    # In the snapshot the single restored erigon node serves both roles.
    networks:
      default:
        aliases:
          - cdk-erigon-rpc-003
    user: "0:0"
    environment:
      - CDK_ERIGON_SEQUENCER=1
    entrypoint: ["cdk-erigon"]
    command: ["--config", "/etc/cdk-erigon/config.yaml"]
    volumes:
      - ./config/003/cdk-erigon/etc:/etc/cdk-erigon:ro
      - cdk-erigon-data-003:/home/erigon/data
    ports:
      - "13545:8545"    # HTTP RPC
      - "13546:8546"    # WebSocket RPC
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 180s

  aggkit-003:
    image: aggkit:local
    container_name: cdk-erigon-20260529-225318-aggkit-003
    hostname: aggkit-003
    entrypoint: ["/usr/local/bin/aggkit"]
    command:
      - "run"
      - "--cfg=/etc/aggkit/config.toml"
      - "--components=aggsender,bridge"
    volumes:
      - ./config/003/aggkit-config.toml:/etc/aggkit/config.toml:ro
      - ./config/003/sequencer.keystore:/etc/aggkit/sequencer.keystore:ro
      - ./config/003/aggoracle.keystore:/etc/aggkit/aggoracle.keystore:ro
      - ./config/003/sovereignadmin.keystore:/etc/aggkit/sovereignadmin.keystore:ro
    ports:
      - "13576:5576"    # RPC
      - "13577:5577"    # REST API
    depends_on:
      geth:
        condition: service_healthy
      cdk-erigon-003:
        condition: service_healthy
      agglayer:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - RUST_BACKTRACE=1

volumes:
  cdk-erigon-data-001:
  cdk-erigon-data-002:
  cdk-erigon-data-003:
# L1 state is baked in, L2 starts fresh with config-only mounts
# Agglayer and AggKit use host-mounted config files (read-only)
