    image: aggkit:local
    container_name: aggkit-e2e-cdk-erigon-3chains-20260625-130900-aggkit-002
    hostname: aggkit-002
    entrypoint: ["/usr/local/bin/aggkit"]
    command:
      - "run"
      - "--cfg=/etc/aggkit/config.toml"
      - "--components=aggsender,bridge"
    volumes:
      - ./config/002/aggkit-config.toml:/etc/aggkit/config.toml:ro
      - ./config/002/sequencer.keystore:/etc/aggkit/sequencer.keystore:ro
      - ./config/002/aggoracle.keystore:/etc/aggkit/aggoracle.keystore:ro
      - ./config/002/sovereignadmin.keystore:/etc/aggkit/sovereignadmin.keystore:ro
    ports:
      - "12576:5576"    # RPC
      - "12577:5577"    # REST API
    depends_on:
      geth:
        condition: service_healthy
      cdk-erigon-002:
        condition: service_healthy
      agglayer:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - RUST_BACKTRACE=1

  cdk-erigon-003:
    image: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/public/cdk-erigon:v2.65.0-RC1
    container_name: aggkit-e2e-cdk-erigon-3chains-20260625-130900-cdk-erigon-003
    hostname: cdk-erigon-003
    networks:
      default:
        aliases:
          - cdk-erigon-rpc-003
    user: "0:0"
    environment:
      - CDK_ERIGON_SEQUENCER=1
    entrypoint: ["cdk-erigon"]
    command: ["--config", "/etc/cdk-erigon/config.yaml"]
    volumes:
      - ./config/003/cdk-erigon/etc:/etc/cdk-erigon:ro
      - cdk-erigon-data-003:/home/erigon/data
    ports:
