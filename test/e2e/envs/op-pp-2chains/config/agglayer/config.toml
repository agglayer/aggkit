# ============================================================================
# Agglayer Configuration - Adapted for Docker Compose Snapshot
# ============================================================================
# This configuration has been adapted from the Kurtosis enclave for use in
# a docker-compose environment. Key changes:
#
# - L1 RPC endpoints changed to use 'geth' hostname (from Kurtosis service name)
# - L2 RPC endpoints commented out (L2 stack not included in L1-only snapshot)
# - Gas price floor configured (1 gwei minimum to ensure L1 miners accept txs)
# - All contract addresses and keys preserved from original deployment
#
# To use with L2:
# 1. Deploy L2 services (cdk-erigon-rpc or equivalent)
# 2. Uncomment the L2 RPC lines in [full-node-rpcs] section
# 3. Update the hostname to match your L2 service name
# ============================================================================

debug-mode = true


# Only supported by fork 12+
mock-verifier = true


[full-node-rpcs]
# OP Stack RPC
1 = "http://op-geth-001:8545"

[proof-signers]
1 = "0x5b06837A43bdC3dD9F114558DAf4B26ed49842Ed"
[prover.mock-prover]
proving-timeout = "5m"
proving_request_timeout = "300s"

[rpc]
grpc-port = 4443
readrpc-port = 4444
admin-port = 4446
host = "0.0.0.0"
request-timeout = 180
# size is define in bytes e.g. 100 * 1024 * 1024
# same for `max_response_body_size`
# default value is equal to 10MB
max-request-body-size = 104857600

[grpc]
# size is define in bytes e.g. 100 * 1024 * 1024
# same for `max-encoding-message-size`
# default value is equal to 4MB
max-decoding-message-size = 104857600

[outbound.rpc.settle]
max-retries = 3
retry-interval = 7
confirmations = 1
settlement-timeout = 1200
gas-multiplier-factor = 175

# Gas price configuration for settlement transactions
# Ensures fees are high enough to be accepted by L1 miners
[outbound.rpc.settle.gas-price]
floor = "1gwei"        # 1 gwei minimum (L1 default miner.gasprice is 0.001 gwei)
ceiling = "100gwei"    # 100 gwei maximum
multiplier = 1000      # 1.0x multiplier (scaled by 1000)

[log]
# level = "debug"
level = "debug" # we want debug visibility for now
outputs = ["stderr"]
format = "pretty"

[auth.local]
private-keys = [
    { path = "/etc/agglayer/aggregator.keystore", password = "pSnv6Dh5s9ahuzGzH9RoCDrKAMddaX3m" },
]

[l1]
chain-id = 271828
node-url = "http://geth:8545"
ws-node-url = "ws://geth:8546"
rollup-manager-contract = "0x6c6c009cC348976dB4A908c92B24433d4F6edA43"
polygon-zkevm-global-exit-root-v2-contract = "0x1f7ad7caA53e35b4f0D138dC5CBF91aC108a2674"
rpc-timeout = 45

[l2]
rpc-timeout = 45

[telemetry]
prometheus-addr = "0.0.0.0:9092"

# https://github.com/orgs/agglayer/discussions/213

[rate-limiting]
send-tx = "unlimited"
# [rate-limiting.send-tx]
# max-per-interval = 1
# time-interval = "15m"

[rate-limiting.network]

[epoch.block-clock]
epoch-duration = 15
genesis-block = 35

[shutdown]
runtime-timeout = 5

[certificate-orchestrator]
input-backpressure-buffer-size = 1000

[certificate-orchestrator.prover.sp1-local]

[storage]
db-path = "/etc/agglayer/storage"

[storage.backup]
path = "/etc/agglayer/backups"
state-max-backup-count = 100
pending-max-backup-count = 100
