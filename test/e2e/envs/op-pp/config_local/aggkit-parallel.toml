# ==============================================================================
# Local aggkit config against the running Docker Compose environment.
# Run aggsender only:
#   ./target/aggkit run --cfg=aggsender-local.toml --components=aggsender
# Run validator only:
#   ./target/aggkit run --cfg=aggsender-local.toml --components=aggsender-validator
# Run both:
#   ./target/aggkit run --cfg=aggsender-local.toml --components=aggsender,aggsender-validator
# ==============================================================================

PathRWData = "/tmp/aggkit-local"

# Docker containers are accessed via their mapped host ports:
#   geth (L1)      -> localhost:8545
#   op-geth-001    -> localhost:11545
#   op-node-001    -> localhost:11547
#   agglayer       -> localhost:4443
L1URL    = "http://localhost:8545"
L2URL    = "http://localhost:11545"
OpNodeURL = "http://localhost:11547"
AggLayerURL = "http://localhost:4443"

rollupCreationBlockNumber      = "37"
rollupManagerCreationBlockNumber = "37"
genesisBlockNumber             = "37"

# ------------------------------------------------------------------------------
[L1Config]
URL      = "http://localhost:8545"
chainId  = "271828"
polygonZkEVMGlobalExitRootAddress = "0x1f7ad7caA53e35b4f0D138dC5CBF91aC108a2674"
polygonRollupManagerAddress       = "0x6c6c009cC348976dB4A908c92B24433d4F6edA43"
polTokenAddress                   = "0xEdE9cf798E0fE25D35469493f43E88FeA4a5da0E"
polygonZkEVMAddress               = "0x414e9E227e4b589aF92200508aF5399576530E4e"
BridgeAddr = "0xC8cbEBf950B9Df44d987c8619f092beA980fF038"

# ------------------------------------------------------------------------------
[L2Config]
GlobalExitRootAddr = "0xa40d5f56745a118d0906a34e69aec8c0db1cb8fa"
BridgeAddr         = "0xC8cbEBf950B9Df44d987c8619f092beA980fF038"

# ------------------------------------------------------------------------------
[Log]
Environment = "development"
Level       = "debug"
Outputs     = ["stderr"]

# ------------------------------------------------------------------------------
# Use different ports to avoid conflicts with the running aggkit container
# (which uses 5576/5577/9091)
[RPC]
Port = "5596"

[REST]
Port = "5597"

[Prometheus]
Enabled = true
Host    = "localhost"
Port    = 9096
# ------------------------------------------------------------------------------
[AggSender]
AggsenderPrivateKey = {Path = "test/e2e/envs/op-pp/config/001/sequencer.keystore", Password = "pSnv6Dh5s9ahuzGzH9RoCDrKAMddaX3m"}
Mode = "PessimisticProof"
CheckStatusCertificateInterval = "1s"
TriggerCertMode = "ASAP"

[AggSender.ValidatorClient]
# Base gRPC config; actual per-signer URLs come from the agglayer committee
UseTLS = false

[AggSender.AggkitProverClient]
UseTLS = false

[AggSender.AgglayerClient]

[[AggSender.AgglayerClient.APIRateLimits]]
MethodName = "SendCertificate"

[AggSender.AgglayerClient.APIRateLimits.RateLimit]
NumRequests = 0

[AggSender.AgglayerClient.GRPC]
URL                = "http://localhost:4443"
MinConnectTimeout  = "5s"
RequestTimeout     = "300s"
UseTLS             = false

[AggSender.AgglayerClient.GRPC.Retry]
InitialBackoff     = "1s"
MaxBackoff         = "10s"
BackoffMultiplier  = 2.0
MaxAttempts        = 20

# ------------------------------------------------------------------------------
[BridgeL2Sync]
BridgeAddr     = "0xC8cbEBf950B9Df44d987c8619f092beA980fF038"
BlockFinality  = "LatestBlock"

[ReorgDetectorL2]
FinalizedBlock = "FinalizedBlock"

# ------------------------------------------------------------------------------
[L1InfoTreeSync]
InitialBlock = "37"

# ------------------------------------------------------------------------------
[L2GERSync]
BlockFinality = "LatestBlock"

# ------------------------------------------------------------------------------
# Validator (aggsender-validator component)
# Most fields are resolved automatically from AggSender/L1Config/L2Config defaults.
# Port 5580 avoids conflict with the running container (which uses 5578).
[Validator]
EnableRPC = true
Signer    = { Method = "local", Path = "test/e2e/envs/op-pp/config/001/sequencer.keystore", Password = "pSnv6Dh5s9ahuzGzH9RoCDrKAMddaX3m" }

[Validator.ServerConfig]
Host                    = "0.0.0.0"
Port                    = 5581
MaxDecodingMessageSize  = 1073741824  # 1GB
