# Ethereum L1 Snapshot Environment
# Enclave: op-pp
# Tag: op-pp-20260602-214600
# Genesis: 0xb6ba05ff23c9acc3d6cf1f1543f9c38a867b5a837738e2c6c27a178f093924f9

services:
  geth:
    image: snapshot-geth:op-pp-20260602-214600
    container_name: op-pp-20260602-214519-geth
    hostname: geth
    # Alias the restored L1 EL under its original kurtosis service name so
    # components that hardcode the kurtosis L1 RPC hostname keep resolving it.
    # cdk-erigon's captured config.yaml references zkevm.l1-rpc-url as
    # http://el-1-geth-lighthouse:8545; op-stack instead has its L1 hostnames
    # rewritten to "geth" during adaptation. The alias is harmless for op-stack.
    networks:
      default:
        aliases:
          - el-1-geth-lighthouse
    command:
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.vhosts=*"
      - "--http.corsdomain=*"
      - "--http.api=admin,engine,net,eth,web3,debug,txpool"
      - "--ws"
      - "--ws.addr=0.0.0.0"
      - "--ws.port=8546"
      - "--ws.origins=*"
      - "--ws.api=admin,engine,net,eth,web3,debug,txpool"
      - "--authrpc.addr=0.0.0.0"
      - "--authrpc.port=8551"
      - "--authrpc.vhosts=*"
      - "--authrpc.jwtsecret=/jwt/jwtsecret"
      - "--datadir=/data/geth/execution-data"
      - "--port=30303"
      - "--discovery.port=30303"
      - "--syncmode=full"
      - "--gcmode=archive"
      - "--networkid=271828"
      - "--metrics"
      - "--metrics.addr=0.0.0.0"
      - "--metrics.port=9001"
      - "--allow-insecure-unlock"
      - "--nodiscover"
    ports:
      - "8545:8545"    # HTTP RPC
      - "8546:8546"    # WebSocket RPC
      - "8551:8551"    # Engine API
      - "30303:30303"  # P2P TCP
      - "30303:30303/udp"  # P2P UDP
      - "9001:9001"    # Metrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 10s

  beacon:
    image: snapshot-beacon:op-pp-20260602-214600
    container_name: op-pp-20260602-214519-beacon
    hostname: beacon
    # Note: command is handled by beacon-entrypoint.sh which patches genesis time and starts Teku
    ports:
      - "4000:4000"    # Beacon API
      - "9000:9000"    # P2P TCP
      - "9000:9000/udp"  # P2P UDP
      - "5054:5054"    # Metrics
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/eth/v1/node/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 30s

  validator:
    image: snapshot-validator:op-pp-20260602-214600
    container_name: op-pp-20260602-214519-validator
    hostname: validator
    # Command is handled by validator-entrypoint.sh which gates startup on beacon sync
    depends_on:
      beacon:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "validator-client"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  agglayer:
    image: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/public/agglayer:0.4.4-remove-agglayer-prover
    container_name: op-pp-20260602-214519-agglayer
    hostname: agglayer
    entrypoint: ["/usr/local/bin/agglayer"]
    command:
      - "run"
      - "--cfg"
      - "/etc/agglayer/config.toml"
    volumes:
      - ./config/agglayer/config.toml:/etc/agglayer/config.toml:ro
      - ./config/agglayer/aggregator.keystore:/etc/agglayer/aggregator.keystore:ro
    ports:
      - "4443:4443"    # gRPC RPC
      - "4444:4444"    # Read RPC
      - "4446:4446"    # Admin API
      - "9092:9092"    # Prometheus metrics
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /proc/1/cmdline"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - RUST_BACKTRACE=1

  op-geth-001:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101605.0
    container_name: op-pp-20260602-214519-op-geth-001
    hostname: op-geth-001
    entrypoint: ["/bin/sh", "/entrypoint/op-geth-entrypoint.sh"]
    volumes:
      - ./config/001/jwt.hex:/jwt/jwtsecret:ro
      - ./config/001/l2-genesis.json:/genesis-ro/l2-genesis.json:ro
      - ./config/001/rollup.json:/rollup-ro/rollup.json:ro
      - ./config/001/op-geth-entrypoint.sh:/entrypoint/op-geth-entrypoint.sh:ro
      - l2-shared-001:/shared
    ports:
      - "11545:8545"    # HTTP RPC
      - "11546:8546"    # WebSocket RPC
      - "11551:8551"    # Engine API
    depends_on:
      geth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 180s

  op-node-001:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.16.12
    container_name: op-pp-20260602-214519-op-node-001
    hostname: op-node-001
    entrypoint: ["/bin/sh", "/entrypoint/op-node-entrypoint.sh"]
    environment:
      - OP_GETH_HOST=op-geth-001
    volumes:
      - ./config/001/rollup.json:/rollup-ro/rollup.json:ro
      - ./config/001/l1-genesis.json:/network-configs/l1-genesis.json:ro
      - ./config/001/jwt.hex:/jwt/jwtsecret:ro
      - ./config/001/op-node-entrypoint.sh:/entrypoint/op-node-entrypoint.sh:ro
      - l2-shared-001:/shared:ro
    ports:
      - "11547:8547"    # RPC
      - "11300:7300"    # Metrics
    depends_on:
      geth:
        condition: service_healthy
      beacon:
        condition: service_healthy
      op-geth-001:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "--post-data={\"jsonrpc\":\"2.0\",\"method\":\"optimism_syncStatus\",\"params\":[],\"id\":1}", "--header=Content-Type:application/json", "http://localhost:8547"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 240s

  op-batcher-001:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:v1.16.9
    container_name: op-pp-20260602-214519-op-batcher-001
    hostname: op-batcher-001
    command:
      - "op-batcher"
      - "--l2-eth-rpc=http://op-geth-001:8545"
      - "--rollup-rpc=http://op-node-001:8547"
      - "--poll-interval=1s"
      - "--sub-safety-margin=6"
      - "--num-confirmations=1"
      - "--safe-abort-nonce-too-low-count=3"
      - "--resubmission-timeout=30s"
      - "--rpc.addr=0.0.0.0"
      - "--rpc.port=8548"
      - "--rpc.enable-admin"
      - "--max-channel-duration=1"
      - "--l1-eth-rpc=http://geth:8545"
      - "--private-key=0xa51bc3351fffe667d7f2fd30dc040687e2d65e2f941837bad219bb1f0466dfaa"
      - "--data-availability-type=blobs"
      - "--altda.enabled=false"
      - "--altda.da-server="
      - "--altda.da-service"
      - "--data-availability-type=calldata"
    ports:
      - "11548:8548"    # batcher RPC/admin
    depends_on:
      geth:
        condition: service_healthy
      op-geth-001:
        condition: service_healthy
      op-node-001:
        condition: service_healthy
    restart: unless-stopped

  aggkit-001:
    image: aggkit:local
    container_name: op-pp-20260602-214519-aggkit-001
    hostname: aggkit-001
    entrypoint: ["/usr/local/bin/aggkit"]
    command:
      - "run"
      - "--cfg=/etc/aggkit/config.toml"
      - "--components=aggsender,aggoracle,bridge"
    volumes:
      - ./config/001/aggkit-config.toml:/etc/aggkit/config.toml:ro
      - ./config/001/sequencer.keystore:/etc/aggkit/sequencer.keystore:ro
      - ./config/001/aggoracle.keystore:/etc/aggkit/aggoracle.keystore:ro
      - ./config/001/sovereignadmin.keystore:/etc/aggkit/sovereignadmin.keystore:ro
    ports:
      - "11576:5576"    # RPC
      - "11577:5577"    # REST API
    depends_on:
      geth:
        condition: service_healthy
      op-geth-001:
        condition: service_healthy
      op-node-001:
        condition: service_healthy
      agglayer:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - RUST_BACKTRACE=1

  # aggsender-validator-004 is an OPTIONAL, on-demand committee validator used only by
  # TestCommitteeUpdates (P10). It is gated behind the "committee" compose profile, so a plain
  # `docker compose up -d` (the default the loader runs in ensureDockerComposeRunning) SKIPS it
  # entirely. It is started imperatively by the loader helper StartAggsenderValidator
  # (`docker compose --profile committee up -d aggsender-validator-004`) and torn down by
  # StopAggsenderValidator (`docker compose rm -sf aggsender-validator-004`).
  #
  # The hostname `aggkit-001-aggsender-validator-004` exactly matches the on-chain committee
  # member Url (`http://aggkit-001-aggsender-validator-004:5578`) that the test adds, so the
  # aggsender-001 container resolves it on the op-pp_default network and dials its gRPC :5578.
  # It signs with aggsendervalidator-4.keystore (address
  # 0x77A21F79994876973BeF5bbcbbd617a5B32B2f57), which is the same address added on-chain, so the
  # signatures it returns recover to the committee member and certificates settle at threshold 2.
  #
  # It is NOT part of waitForServices and NOT listed in summary.json, so no other test or the
  # post-suite health check ever waits on or is affected by it.
  aggsender-validator-004:
    image: aggkit:local
    container_name: aggkit-001-aggsender-validator-004
    hostname: aggkit-001-aggsender-validator-004
    profiles: ["committee"]
    user: "${UID:-0}:${GID:-0}"
    entrypoint: ["/usr/local/bin/aggkit"]
    command:
      - "run"
      - "--cfg=/etc/aggkit/config.toml"
      - "--components=aggsender-validator"
    volumes:
      - ./config/validator-004/config.toml:/etc/aggkit/config.toml:ro
      - ./config/validator-004/aggsendervalidator-4.keystore:/etc/aggkit/aggsendervalidator-4.keystore:ro
    restart: unless-stopped
    environment:
      - RUST_BACKTRACE=1

