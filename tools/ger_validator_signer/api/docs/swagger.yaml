basePath: /
definitions:
  api.ErrorResponse:
    description: Why the request failed
    properties:
      code:
        description: |-
          Code says what happened: INVALID_REQUEST, GER_UNKNOWN, GER_BLOCK_NOT_CANONICAL, GER_NOT_FINAL (retryable),
          RATE_LIMITED (retryable) or INTERNAL (retryable)
        example: GER_NOT_FINAL
        type: string
      message:
        description: Message is a description for humans
        example: the L1 block that inserted the GER is not final yet
        type: string
    type: object
  api.FinalityInfo:
    properties:
      num_blocks:
        description: NumBlocks is subtracted from the number of the block of the tag
        example: 0
        type: integer
      tag:
        description: 'Tag is the block tag: latest, safe or finalized'
        example: finalized
        type: string
    type: object
  api.HealthResponse:
    description: The validator is running
    properties:
      status:
        example: ok
        type: string
    type: object
  api.InfoResponse:
    description: Version and configuration of the validator
    properties:
      agglayer_ger:
        description: AgglayerGER is the contract of L1 where the GERs are looked up
        example: 0x1111111111111111111111111111111111111111
        type: string
      build_date:
        example: "2026-11-11T10:00:00Z"
        type: string
      finality:
        $ref: '#/definitions/api.FinalityInfo'
      git_branch:
        example: main
        type: string
      git_rev:
        example: 5453f35
        type: string
      l1_chain_id:
        description: L1ChainID is the chain id of L1
        example: 11155111
        type: integer
      signer:
        description: 'Signer is the address that signs: the one to register in the
          AggOracleCommittee'
        example: 0x7e5f4552091a69125d5dfcb7b8c2659029395bdf
        type: string
      version:
        example: v0.10.0
        type: string
    type: object
  api.SignRequest:
    description: GER to sign
    properties:
      ger:
        description: 'GER is the global exit root: 32 bytes, as a hex string with
          the 0x prefix'
        example: 0x0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
        type: string
    type: object
  api.SignResponse:
    description: Signature of a GER
    properties:
      ger:
        description: GER is the GER that was signed
        example: 0x0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
        type: string
      signature:
        description: |-
          Signature is r, s and v (65 bytes) of the signature of keccak256(GER). v is 27 or 28 and s is in the lower
          half of the curve order, as AggOracleCommittee.injectGER requires
        example: 0x0e9eb15c213e333243b2e85294bdb204112c64d19e2cbfe3d2740e4a888147b0415ac1d65fd197e3ff38a5d3920c5d167d95cc88b28e26bc549e4d7783348a9f1c
        type: string
      signer:
        description: Signer is the address of the validator, as registered in the
          AggOracleCommittee
        example: 0x7e5f4552091a69125d5dfcb7b8c2659029395bdf
        type: string
    type: object
info:
  contact: {}
  description: |-
    REST API of the validators of the AggOracleCommittee v2. The AggOracle asks a validator to sign
    a Global Exit Root (GER) and sends the signatures of enough validators to the contract.
    The validator signs a GER only if it is in the AgglayerGER contract of L1 and the L1 block that
    inserted it is canonical and final for the finality the validator is configured with.
  title: GER validator signer API
  version: "1.0"
paths:
  /health:
    get:
      description: 'It doesn''t query L1 or sign: it only says the process is alive.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: The validator is running
      tags:
      - info
  /v1/ger/sign:
    post:
      consumes:
      - application/json
      description: |-
        Signs keccak256(ger) if the GER is in the AgglayerGER contract of L1 and the L1 block that
        inserted it is canonical and final. The signature is what AggOracleCommittee.injectGER verifies.
        The error code decides what to do: GER_NOT_FINAL, RATE_LIMITED and INTERNAL can be retried.
      parameters:
      - description: The GER to sign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.SignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SignResponse'
        "400":
          description: INVALID_REQUEST
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: 'GER_UNKNOWN: the GER is not in the AgglayerGER contract'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: 'GER_BLOCK_NOT_CANONICAL: the L1 block that inserted it is
            not canonical'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: 'INVALID_REQUEST: the body is too big'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "425":
          description: 'GER_NOT_FINAL: retry later (see Retry-After)'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: 'RATE_LIMITED: retry later (see Retry-After)'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: INTERNAL
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Sign a global exit root
      tags:
      - ger
  /v1/info:
    get:
      description: The address that signs is the one to register as a validator in
        the AggOracleCommittee.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.InfoResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Version and configuration of the validator
      tags:
      - info
swagger: "2.0"
